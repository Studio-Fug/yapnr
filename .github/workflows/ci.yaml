name: CI

on:
  # `closed` is needed so the per-PR docs preview is removed when the PR is
  # merged or closed (cleanup-preview). Every other job skips that event.
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - main
  workflow_dispatch:
  # The release workflow runs all of CI at the tag being released (release.yaml).
  workflow_call:

# Least privilege: jobs that publish to gh-pages widen this for themselves.
permissions:
  contents: read

# Superseded PR runs are cancelled. Runs on main are never cancelled once they
# have started, but GitHub keeps only one pending run per group: a queued main
# run is replaced by a newer one, so the newest main commit is the one that
# builds and deploys.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Presubmit lints: the same prek version and config as ./setup-precommit.sh,
  # so a local commit and CI can never disagree. Also checks every new commit
  # of the push or PR: an allowed identity (the owner's public commit address
  # or a GitHub noreply address; see CONTRIBUTING.md), and messages and patches
  # free of private details (merge-commit PRs land every intermediate commit on
  # main).
  lint:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup repository
        uses: actions/checkout@v4
        with:
          # Full history, so the commit range below can be inspected.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The new commits: the PR's commits, or the pushed range on main.
      - name: Determine the new commits
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            range="origin/${BASE_REF}..${HEAD_SHA}"
          elif [ -n "${BEFORE_SHA}" ] && ! echo "${BEFORE_SHA}" | grep -qE '^0+$' \
              && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            range="${BEFORE_SHA}..${GITHUB_SHA}"
          else
            range="origin/main..HEAD"
          fi
          echo "New commits: ${range} ($(git rev-list --count "${range}") commits)"
          echo "COMMIT_RANGE=${range}" >> "${GITHUB_ENV}"

      # Author and committer address of every new commit, one per line. Only
      # the addresses in tools/privacy/allowed_identities.txt (the owner's
      # public commit address), GitHub noreply addresses and GitHub's own
      # committer address pass; the scanner redacts what it prints, so this
      # public log does not leak a rejected address.
      - name: Check commit identities
        # An explicit `shell: bash` adds -o pipefail: a failing `git log` fails the step.
        shell: bash
        run: |
          git log --format='%ae%n%ce' "${COMMIT_RANGE}" \
            | python3 tools/privacy_scan.py --identities

      # Commit messages and patches of the new commits. The tree checks see only
      # the final tree; this also covers intermediate commits and messages. The
      # allowlisted commit addresses pass here (every commit header carries
      # them); in files they are findings like any other personal address.
      - name: Scan commit messages and patches
        shell: bash
        run: |
          git log -p --format='%ae %ce%n%B' "${COMMIT_RANGE}" \
            | python3 tools/privacy_scan.py --stdin

      - name: Install prek
        run: python -m pip install 'prek==0.4.12'

      # prek keeps its hook environments under ~/.cache/prek.
      - name: Cache prek hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: prek-${{ runner.os }}-

      - name: Run lints (prek)
        run: prek run --all-files --show-diff-on-failure --color=always

  # Unit tests and repo checks. The runner is aarch64 because requirements.lock
  # carries CPU-only torch wheels for darwin-arm64 and linux-aarch64 only (see
  # MODULE.bazel). This is also the single job that checks the lock is fresh.
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      # setup-bazel's own caches are not used: their keys carry neither the CPU
      # architecture nor the lock files, and its Bazelisk cache is not where
      # .bazeliskrc sends Bazelisk. Both download caches are keyed below.
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0

      # The environment overrides .bazeliskrc (./.bazelisk), so the Bazel
      # binary lands in the cached directory.
      - name: Point Bazelisk at the cached directory
        run: echo "BAZELISK_HOME=${HOME}/.cache/bazelisk" >> "${GITHUB_ENV}"

      - name: Cache Bazelisk and the Bazel repository cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'requirements.lock') }}
          restore-keys: bazel-repo-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock', 'requirements.lock') }}
          restore-keys: bazel-disk-test-${{ runner.os }}-${{ runner.arch }}-

      - name: Test
        run: >-
          bazel test //... --config=ci
          --disk_cache="$HOME/.cache/bazel-disk"
          --repository_cache="$HOME/.cache/bazel-repo"

      # requirements.test re-resolves requirements.in and diffs the result
      # against requirements.lock. It needs the network and is tagged manual,
      # so it runs here and nowhere else.
      - name: Check requirements.lock is fresh
        run: >-
          bazel test //:requirements.test --config=ci
          --disk_cache="$HOME/.cache/bazel-disk"
          --repository_cache="$HOME/.cache/bazel-repo"

  # Build the Sphinx site and hand it to the deploy jobs as an artifact.
  docs:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      # setup-bazel's own caches are not used: their keys carry neither the CPU
      # architecture nor the lock files, and its Bazelisk cache is not where
      # .bazeliskrc sends Bazelisk. Both download caches are keyed below.
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.15.0

      # The environment overrides .bazeliskrc (./.bazelisk), so the Bazel
      # binary lands in the cached directory.
      - name: Point Bazelisk at the cached directory
        run: echo "BAZELISK_HOME=${HOME}/.cache/bazelisk" >> "${GITHUB_ENV}"

      - name: Cache Bazelisk and the Bazel repository cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'requirements.lock') }}
          restore-keys: bazel-repo-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel-disk
          key: bazel-disk-docs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('MODULE.bazel.lock', 'requirements.lock') }}
          restore-keys: bazel-disk-docs-${{ runner.os }}-${{ runner.arch }}-

      # `bazel run` sets BUILD_WORKSPACE_DIRECTORY to the checkout, so the site
      # lands in $GITHUB_WORKSPACE/docs/site/html.
      - name: Build docs
        run: >-
          bazel run //docs:build --config=ci
          --disk_cache="$HOME/.cache/bazel-disk"
          --repository_cache="$HOME/.cache/bazel-repo"

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: docs/site/html
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # GitHub Pages. The gh-pages branch is the Pages source: main's docs at the
  # root, and every same-repository PR gets a preview under pr-preview/pr-N/
  # once its lint, test and docs jobs pass. All three jobs are gated on the
  # repository variable YAPNR_PAGES_ENABLED and are skipped until it is 'true'.
  #
  # First deploy, once main is green (gh-pages does not exist before it):
  #   1. gh variable set YAPNR_PAGES_ENABLED --body true
  #   2. gh workflow run CI --ref main     (deploy-pages creates gh-pages)
  #   3. Settings > Pages > Build and deployment: "Deploy from a branch",
  #      branch gh-pages, folder / (root)
  #
  # The jobs publish by pushing to gh-pages, so they need contents: write (plus
  # pull-requests: write for the preview comment) and neither pages: nor
  # id-token: permissions.
  #
  # Concurrency: GitHub keeps one pending job per concurrency group and cancels
  # an older pending job, even with cancel-in-progress: false. So each PR's
  # preview and cleanup share a per-PR group (the later event wins), and the
  # root deploy has its own group (a replaced pending deploy is superseded by a
  # newer main). Jobs in different groups may push to gh-pages at the same
  # time: all of them push without force and rebase on a rejected push
  # (github-pages-deploy-action's attempt-limit). If a Pages job is ever
  # cancelled anyway, re-run it.
  # ---------------------------------------------------------------------------
  deploy-preview:
    if: >-
      vars.YAPNR_PAGES_ENABLED == 'true'
      && github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    # Never publish a PR that fails the lints or the privacy gates: gh-pages
    # keeps removed previews in its history.
    needs: [lint, test, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # The action works on the git repository in $GITHUB_WORKSPACE, so check
      # out first; checkout cleans the directory, so download the site after.
      - name: Setup repository
        uses: actions/checkout@v4

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site
          preview-branch: gh-pages
          umbrella-dir: pr-preview

  cleanup-preview:
    if: >-
      vars.YAPNR_PAGES_ENABLED == 'true'
      && github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      - name: Remove PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: remove

  # Pushes to main deploy; so does a manual run on main (the first deploy). Not when the
  # release workflow calls CI (github.workflow is then the caller's name), including its dry
  # run on main.
  deploy-pages:
    if: >-
      vars.YAPNR_PAGES_ENABLED == 'true'
      && github.workflow == 'CI'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    needs: [lint, test, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: gh-pages-main
      cancel-in-progress: false
    steps:
      - name: Setup repository
        uses: actions/checkout@v4

      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      # clean-exclude keeps open PRs' previews when the root is replaced.
      # force: false rebases onto a preview pushed meanwhile instead of
      # overwriting it (the action force-pushes by default).
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
          clean-exclude: |
            pr-preview/
          force: false
