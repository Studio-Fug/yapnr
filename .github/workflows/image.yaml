name: Image

# The container images (docs/containers.md):
#   ghcr.io/studio-fug/yapnr-kicad  Ubuntu 24.04 + KiCad 10 (tag: docker/yapnr-kicad/TAG), and
#                                   <tag>-src, the source packages of its KiCad build
#   ghcr.io/studio-fug/yapnr        that base + CPython 3.11, numpy, CPU torch + the yapnr wheel
# Built natively on ubuntu-24.04 (linux/amd64) and ubuntu-24.04-arm (linux/arm64), no QEMU, and
# smoke-tested on both (tools/image/smoke_image.sh) before anything is tagged.
#
#   pull request        build and smoke-test both architectures; push nothing
#   push to main        also push :edge and :sha-<7>, and the base tag the first time it is built
#   release.yaml        (tags, through workflow_call) push the release tags: X.Y.Z, X.Y and
#                       latest (tools/release/version.py decides; RCs get X.Y.Z-rc.N only)
#
# Pushes are by digest from each architecture's job and are tagged as one multi-architecture
# index by the publish job, with SBOM and provenance (BuildKit) and a GitHub attestation. A
# published base tag is never overwritten: whatever triggered the run, the plan job compares
# docker/yapnr-kicad (tools/image/base_context.sh) with the published base's context label, and a
# change needs a new TAG. The yapnr image is built FROM the base by digest.
#
# The publish job can be re-run: the base's source image goes first, then the base's tags, then
# its attestation, and each step leaves alone what an earlier attempt published. A later run
# publishes a missing source image of a published base.
#
# The workflow runs on every pull request, and the plan job skips the rest when nothing that
# goes into an image changed, so a future required check never waits for a workflow that did
# not start. The `image` job summarizes the run. Informational for now: not a required check
# until the v0.1.0 release (docs/releases.md).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      mode:
        description: release (push the release tags of the tag being built) or dry-run
        type: string
        required: true
    outputs:
      digest:
        description: Digest of the published ghcr.io/studio-fug/yapnr index (empty in a dry run)
        value: ${{ jobs.publish.outputs.digest }}
      kicad-version:
        description: The KiCad version in the images
        value: ${{ jobs.plan.outputs.kicad_version }}

# Least privilege: jobs widen this for themselves.
permissions:
  contents: read

# github.workflow is the caller's name under workflow_call, so a release (or its dry run on
# main) never shares a group with, or gets replaced by, the image runs of pushes to main.
concurrency:
  group: image-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/studio-fug/yapnr
  BASE_IMAGE: ghcr.io/studio-fug/yapnr-kicad

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # is the base published, with its source image?
      attestations: read # ... and attested?
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      base_mode: ${{ steps.plan.outputs.base_mode }}
      publish_base: ${{ steps.plan.outputs.publish_base }}
      publish_base_src: ${{ steps.plan.outputs.publish_base_src }}
      base_tag: ${{ steps.plan.outputs.base_tag }}
      base_ref: ${{ steps.plan.outputs.base_ref }}
      base_digest: ${{ steps.plan.outputs.base_digest }}
      base_context: ${{ steps.plan.outputs.base_context }}
      kicad_version: ${{ steps.plan.outputs.kicad_version }}
      version: ${{ steps.version.outputs.pep440 }}
      oci_tags: ${{ steps.version.outputs.oci_tags }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Setup repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags: tools/release/version.py runs git describe.
          fetch-depth: 0

      - name: Compute the version and image tags
        id: version
        run: python3 tools/release/version.py --ref "${GITHUB_REF}" --github-output "${GITHUB_OUTPUT}"

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide what to build and publish
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          OCI_TAGS: ${{ steps.version.outputs.oci_tags }}
          GH_TOKEN: ${{ github.token }}
        run: |
          base_tag="$(cat docker/yapnr-kicad/TAG)"
          kicad_version="${base_tag%-*}"
          base_context="$(tools/image/base_context.sh HEAD)"

          # What changed. Anything that goes into an image, or builds or tests one, counts.
          range=""
          if [ -z "${MODE}" ] && [ "${EVENT}" = pull_request ]; then
            range="${PR_BASE}...${PR_HEAD}"
          elif [ -z "${MODE}" ] && [ "${EVENT}" = push ] && [ -n "${BEFORE}" ] \
              && ! echo "${BEFORE}" | grep -qE '^0+$' \
              && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}...${GITHUB_SHA}"
          fi
          base_changed=false
          if [ -n "${range}" ]; then
            changed="$(git diff --name-only "${range}")"
            echo "Changed files (${range}):"
            while IFS= read -r file; do echo "  ${file}"; done <<< "${changed}"
            relevant='^(docker/|yapnr/|release/|tools/image/|tools/release/|third_party/image-licenses/|\.github/actions/image-build/|\.github/workflows/image\.yaml$|\.dockerignore$|BUILD\.bazel$|MODULE\.bazel|\.bazel|requirements|LICENSE$|THIRD_PARTY\.md$)'
            build=false
            if echo "${changed}" | grep -qE "${relevant}"; then build=true; fi
            if echo "${changed}" | grep -E '^docker/yapnr-kicad/' | grep -qvE '\.md$'; then
              base_changed=true
            fi
          else
            # Manual runs, release builds and pushes without a usable range build everything.
            build=true
          fi

          # The published base: its index digest (the yapnr image is built FROM it by digest),
          # the docker/yapnr-kicad it was built from, its source image and its attestation.
          lookup() {
            local rc=0
            tools/image/published.sh "$1" || rc=$?
            case "${rc}" in
              0) echo true ;;
              1) echo false ;;
              *) echo "::error::cannot tell whether $1 is published" >&2; exit 1 ;;
            esac
          }
          base_exists="$(lookup "${BASE_IMAGE}:${base_tag}")"
          src_exists="$(lookup "${BASE_IMAGE}:${base_tag}-src")"
          base_digest=""
          base_ref=""
          if [ "${base_exists}" = true ]; then
            base_digest="$(docker buildx imagetools inspect "${BASE_IMAGE}:${base_tag}" \
              --format '{{json .Manifest}}' | jq -r .digest)"
            base_ref="${BASE_IMAGE}:${base_tag}@${base_digest}"
            published_context="$(docker buildx imagetools inspect "${BASE_IMAGE}@${base_digest}" \
              --format '{{json (index .Image "linux/amd64").Config.Labels}}' \
              | jq -r '."io.github.studio-fug.yapnr.kicad.context" // ""')"
            echo "${base_ref}: built from docker/yapnr-kicad ${published_context:-(no label)}," \
              "the checkout has ${base_context}"
            # A published tag is never overwritten.
            if [ -n "${published_context}" ] && [ "${published_context}" != "${base_context}" ] \
                || { [ -z "${published_context}" ] && [ "${base_changed}" = true ]; }; then
              echo "::error file=docker/yapnr-kicad/TAG::docker/yapnr-kicad differs from what" \
                "${BASE_IMAGE}:${base_tag} was built from, and a published base tag is never" \
                "overwritten. Bump docker/yapnr-kicad/TAG (the -N suffix, or the KiCad version)."
              exit 1
            fi
            if [ "${src_exists}" = false ]; then
              echo "::warning::${BASE_IMAGE}:${base_tag}-src (the KiCad source image) is missing;" \
                "the next publishing run publishes it"
            fi
            if ! gh api "repos/${GITHUB_REPOSITORY}/attestations/${base_digest}" --silent 2>/dev/null; then
              echo "::warning::found no attestation of ${base_ref}. If its publish job failed," \
                "re-run that job; otherwise publish the base under a new docker/yapnr-kicad/TAG."
            fi
          fi
          base_mode=registry
          if [ "${base_exists}" = false ]; then base_mode=build; fi

          # Publishing: :edge from main pushes, the release tags from release.yaml.
          # (A manual run on main publishes too, like a push: a way to retry.)
          publish=false
          if [ "${MODE}" = release ]; then
            publish=true
          elif [ -z "${MODE}" ] && [ "${GITHUB_REF}" = refs/heads/main ] \
              && { [ "${EVENT}" = push ] || [ "${EVENT}" = workflow_dispatch ]; }; then
            publish=true
          fi
          if [ "${publish}" = true ] && [ -z "${OCI_TAGS}" ]; then
            echo "::error::nothing to tag: tools/release/version.py gave no image tags for ${GITHUB_REF}"
            exit 1
          fi
          # A publishing run that finds the base or its source image missing builds, whatever
          # changed.
          if [ "${publish}" = true ] && { [ "${base_exists}" = false ] || [ "${src_exists}" = false ]; }; then
            build=true
          fi
          if [ "${build}" = false ]; then publish=false; fi
          publish_base=false
          publish_base_src=false
          if [ "${publish}" = true ]; then
            if [ "${base_exists}" = false ]; then publish_base=true; fi
            if [ "${src_exists}" = false ]; then publish_base_src=true; fi
          fi

          {
            echo "build=${build}"
            echo "publish=${publish}"
            echo "base_mode=${base_mode}"
            echo "publish_base=${publish_base}"
            echo "publish_base_src=${publish_base_src}"
            echo "base_tag=${base_tag}"
            echo "base_ref=${base_ref}"
            echo "base_digest=${base_digest}"
            echo "base_context=${base_context}"
            echo "kicad_version=${kicad_version}"
          } | tee -a "${GITHUB_OUTPUT}"
          {
            echo "### Image plan"
            echo "- build: ${build}, publish: ${publish} (tags: ${OCI_TAGS:-none})"
            echo "- base ${BASE_IMAGE}:${base_tag}: ${base_mode} (published: ${base_exists};" \
              "publish now: ${publish_base}; ${base_ref:-not published yet})"
            echo "- source image ${BASE_IMAGE}:${base_tag}-src: published: ${src_exists};" \
              "publish now: ${publish_base_src}"
          } >> "${GITHUB_STEP_SUMMARY}"

  # The yapnr wheel, stamped with the version from git. Pure Python: built once.
  wheel:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Setup repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-bazel's own caches are not used: see ci.yaml. This job builds what the images
      # ship, so every action in it is pinned by commit, like those of the publishing jobs.
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0

      - name: Point Bazelisk at the cached directory
        run: echo "BAZELISK_HOME=${HOME}/.cache/bazelisk" >> "${GITHUB_ENV}"

      - name: Cache Bazelisk and the Bazel repository cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'requirements.lock') }}
          restore-keys: bazel-repo-${{ runner.os }}-${{ runner.arch }}-

      - name: Build the wheel
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          bazel build //release:wheel.dist --config=ci --stamp --embed_label="${VERSION}" \
            --repository_cache="$HOME/.cache/bazel-repo"
          mkdir -p dist
          cp "$(bazel info --config=ci bazel-bin)"/release/wheel_dist/yapnr-*.whl dist/
          ls -l dist
          test "$(find dist -name 'yapnr-*.whl' | wc -l)" -eq 1

      - name: Upload the wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Build and smoke-test without publishing (pull requests, dry runs).
  build:
    needs: [plan, wheel]
    if: needs.plan.outputs.build == 'true' && needs.plan.outputs.publish != 'true'
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - name: Setup repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel
          path: dist

      - name: Build and smoke-test
        uses: ./.github/actions/image-build
        with:
          arch: ${{ matrix.arch }}
          base-mode: ${{ needs.plan.outputs.base_mode }}
          base-tag: ${{ needs.plan.outputs.base_tag }}
          base-ref: ${{ needs.plan.outputs.base_ref }}
          base-digest: ${{ needs.plan.outputs.base_digest }}
          base-context: ${{ needs.plan.outputs.base_context }}
          kicad-version: ${{ needs.plan.outputs.kicad_version }}
          version: ${{ needs.plan.outputs.version }}
          revision: ${{ needs.plan.outputs.sha }}
          push: 'false'
          push-base: 'false'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # The same, then push by digest (main, releases). Only this job and publish write packages.
  build-publish:
    needs: [plan, wheel]
    if: needs.plan.outputs.build == 'true' && needs.plan.outputs.publish == 'true'
    name: build and push (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - name: Setup repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheel
          path: dist

      - name: Build, smoke-test and push by digest
        uses: ./.github/actions/image-build
        with:
          arch: ${{ matrix.arch }}
          base-mode: ${{ needs.plan.outputs.base_mode }}
          base-tag: ${{ needs.plan.outputs.base_tag }}
          base-ref: ${{ needs.plan.outputs.base_ref }}
          base-digest: ${{ needs.plan.outputs.base_digest }}
          base-context: ${{ needs.plan.outputs.base_context }}
          kicad-version: ${{ needs.plan.outputs.kicad_version }}
          version: ${{ needs.plan.outputs.version }}
          revision: ${{ needs.plan.outputs.sha }}
          push: 'true'
          push-base: ${{ needs.plan.outputs.publish_base }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Publish the base's source image, tag the multi-architecture indexes and attest them. Runs
  # only when every architecture passed its smoke test. Safe to re-run: every base step first
  # looks at what an earlier attempt published.
  publish:
    needs: [plan, build-publish]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    env:
      BASE_TAG: ${{ needs.plan.outputs.base_tag }}
    steps:
      - name: Setup repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- the KiCad base: its source image first, then its tags, then the attestation -------
      # The corresponding source of the bundled KiCad (docs/containers.md), for both platforms,
      # so that it can be pulled on any host. Never deleted, and never replaced: a re-run finds
      # it published and leaves it alone.
      - name: Is the KiCad source image published?
        id: src
        if: needs.plan.outputs.publish_base_src == 'true'
        run: |
          rc=0
          tools/image/published.sh "${BASE_IMAGE}:${BASE_TAG}-src" || rc=$?
          case "${rc}" in
            0) echo "publish=false" >> "${GITHUB_OUTPUT}"; echo "published by an earlier attempt" ;;
            1) echo "publish=true" >> "${GITHUB_OUTPUT}" ;;
            *) exit 1 ;;
          esac

      - name: Publish the KiCad source image
        if: steps.src.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/yapnr-kicad/Dockerfile
          target: src
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.BASE_IMAGE }}:${{ needs.plan.outputs.base_tag }}-src
          labels: |
            org.opencontainers.image.title=yapnr-kicad sources
            org.opencontainers.image.description=Source packages of KiCad in ${{ env.BASE_IMAGE }}:${{ needs.plan.outputs.base_tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
            org.opencontainers.image.licenses=GPL-3.0-or-later AND CC-BY-SA-4.0
          push: true
          provenance: mode=max
          sbom: false

      # The first time the base tag is built. <kicad>-<N> is immutable; <kicad> and
      # <major.minor> follow the newest base. A re-run finds the tag on exactly these images
      # and only makes sure of the moving tags; a tag on other images is never overwritten.
      - name: Tag the KiCad base
        id: base-index
        if: needs.plan.outputs.publish_base == 'true'
        env:
          KICAD_VERSION: ${{ needs.plan.outputs.kicad_version }}
          REVISION: ${{ needs.plan.outputs.sha }}
        run: |
          sources=()
          for digest in "${RUNNER_TEMP}"/digests/yapnr-kicad/*; do
            sources+=("${BASE_IMAGE}@sha256:$(basename "${digest}")")
          done
          test "${#sources[@]}" -eq 2
          manifests() { jq -r '[.manifests[].digest] | sort | join(" ")'; }
          want="$(docker buildx imagetools create --dry-run "${sources[@]}" | manifests)"
          moving=(--tag "${BASE_IMAGE}:${KICAD_VERSION}" --tag "${BASE_IMAGE}:${KICAD_VERSION%.*}")
          rc=0
          tools/image/published.sh "${BASE_IMAGE}:${BASE_TAG}" || rc=$?
          case "${rc}" in
            0)
              have="$(docker buildx imagetools inspect --raw "${BASE_IMAGE}:${BASE_TAG}" | manifests)"
              if [ "${have}" != "${want}" ]; then
                echo "::error::${BASE_IMAGE}:${BASE_TAG} exists already, with other images; not" \
                  "overwriting it (did another run publish this TAG first?)"
                exit 1
              fi
              echo "${BASE_IMAGE}:${BASE_TAG} is these images already (an earlier attempt)"
              digest="$(docker buildx imagetools inspect "${BASE_IMAGE}:${BASE_TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
              docker buildx imagetools create "${moving[@]}" "${BASE_IMAGE}@${digest}"
              ;;
            1)
              docker buildx imagetools create \
                --tag "${BASE_IMAGE}:${BASE_TAG}" "${moving[@]}" \
                --annotation "index:org.opencontainers.image.description=Ubuntu 24.04 with KiCad ${KICAD_VERSION} for headless use; the base of ${IMAGE}" \
                --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
                --annotation "index:org.opencontainers.image.licenses=GPL-3.0-or-later AND CC-BY-SA-4.0" \
                --annotation "index:org.opencontainers.image.revision=${REVISION}" \
                "${sources[@]}"
              digest="$(docker buildx imagetools inspect "${BASE_IMAGE}:${BASE_TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
              ;;
            *) exit 1 ;;
          esac
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          docker buildx imagetools inspect "${BASE_IMAGE}:${BASE_TAG}"

      - name: Attest the KiCad base
        if: needs.plan.outputs.publish_base == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.BASE_IMAGE }}
          subject-digest: ${{ steps.base-index.outputs.digest }}
          push-to-registry: true

      # --- the yapnr image ---------------------------------------------------------------
      - name: Tag the yapnr image
        id: index
        env:
          OCI_TAGS: ${{ needs.plan.outputs.oci_tags }}
          VERSION: ${{ needs.plan.outputs.version }}
          REVISION: ${{ needs.plan.outputs.sha }}
          KICAD_VERSION: ${{ needs.plan.outputs.kicad_version }}
        run: |
          sources=()
          for digest in "${RUNNER_TEMP}"/digests/yapnr/*; do
            sources+=("${IMAGE}@sha256:$(basename "${digest}")")
          done
          test "${#sources[@]}" -eq 2
          tags=()
          IFS=',' read -r -a names <<< "${OCI_TAGS}"
          for name in "${names[@]}"; do tags+=(--tag "${IMAGE}:${name}"); done
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.description=yapnr (yet another place and route) with KiCad ${KICAD_VERSION} and the Python runtime" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "index:org.opencontainers.image.licenses=AGPL-3.0-or-later AND GPL-3.0-or-later AND CC-BY-SA-4.0" \
            --annotation "index:org.opencontainers.image.version=${VERSION}" \
            --annotation "index:org.opencontainers.image.revision=${REVISION}" \
            "${sources[@]}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${names[0]}" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          docker buildx imagetools inspect "${IMAGE}:${names[0]}"
          {
            echo "### Published ${IMAGE}"
            echo "- tags: ${OCI_TAGS}"
            echo "- digest: \`${digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Attest the yapnr image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

  # One result for the whole workflow (skipped jobs count as success), so that a single
  # check can become required later without depending on which jobs ran.
  image:
    needs: [plan, wheel, build, build-publish, publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success | skipped) ;;
              *) echo "::error::an image job ended with '${result}'"; exit 1 ;;
            esac
          done
