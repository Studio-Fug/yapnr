name: Ladder

# The native regression ladder (hardware/pnr/regression/README.md) inside the published arm64
# image ghcr.io/studio-fug/yapnr:edge, resolved to a digest:
#
#   pull request      cases 01 to 06, seed 0, baseline configuration, when engine inputs changed
#   nightly (main)    all 8 cases, seeds 0 and 1, baseline; then all 8, seed 0, with the initial
#                     placement pool and traces, rendered to animations (artifacts only); then
#                     the showcases (designs.showcases() and 07-chaser-20, traced), rendered too
#                     (informational: a showcase never decides the job); both traced runs take
#                     the committed animations' options (--compact --gloss, docs/animations/
#                     manifest.json), so their trace hashes are comparable; then the opt-in gloss
#                     stage (run.py --gloss, PNR_GLOSS) on 04-inverter-leds-8 and 07-chaser-20,
#                     seed 0: no other run exercises it while the flag is off by default; then
#                     the hard rungs of the ladder lane (the public ladder's rungs 09 to 12,
#                     docs/regression-ladder.md) and of the nightly lane (hard_rungs.py, ci.lane),
#                     seed 0 (informational: a hard rung never decides the job)
#   manual            cases, seeds, animations, showcases, the gloss stage and a hard-rung lane
#                     as given
#
# Every run first judges the exact-separation router's routes with KiCad's DRC
# (tests/test_exact_route_kicad.py, the KiCad tier of its unit tests), then runs the KiCad
# tier of the supply, pad-local clearance and board-edge tests under the image's own KiCad
# Python (no numpy there; the numeric parts go to the ladder's Python).
#
# The ladder runs the checkout's engine sources (run.py freezes them), not the image's wheel. A
# pull request can change the runtime pins, so a runtime guard compares the image's /opt/venv
# with docker/yapnr/runtime-arm64.lock and, if they differ, installs the checkout's lock into
# an overlay venv from the image's own CPython. A change to docker/yapnr-kicad (a KiCad base
# that is not published yet) skips the ladder with a notice; image.yaml tests the new base.
#
# Informational: not a required check yet. The final `ladder` job always reports, so the check
# can become required later without a path filter leaving it pending. While the GHCR packages
# are private, pull requests from forks skip the ladder (no package access).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      cases:
        description: Space-separated case names (empty = all 8)
        type: string
        default: ''
      seeds:
        description: Space-separated seeds
        type: string
        default: '0'
      animate:
        description: Also run the traced pool ladder and render its animations
        type: boolean
        default: false
      showcases:
        description: Also run the showcase cases traced and render their animations
        type: boolean
        default: false
      hard_lane:
        description: Also run the hard rungs of these CI lanes (hard_rungs.py), seed 0, informational
        type: choice
        options: [none, ladder, nightly, ladder nightly, manual]
        default: none
      gloss:
        description: Also run the opt-in gloss stage (run.py --gloss) on two cases
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ladder-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/studio-fug/yapnr
  PR_CASES: >-
    01-connector-led-2 02-resistor-led-3 03-branched-leds-5 04-inverter-leds-8 05-timer-led-10
    06-chaser-14

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.plan.outputs.run }}
      cases: ${{ steps.plan.outputs.cases }}
      seeds: ${{ steps.plan.outputs.seeds }}
      animate: ${{ steps.plan.outputs.animate }}
      showcases: ${{ steps.plan.outputs.showcases }}
      gloss: ${{ steps.plan.outputs.gloss }}
      timeout: ${{ steps.plan.outputs.timeout }}
      baseline_minutes: ${{ steps.plan.outputs.baseline_minutes }}
      traced_minutes: ${{ steps.plan.outputs.traced_minutes }}
      showcase_minutes: ${{ steps.plan.outputs.showcase_minutes }}
      hard_lane: ${{ steps.plan.outputs.hard_lane }}
      hard_minutes: ${{ steps.plan.outputs.hard_minutes }}
      gloss_minutes: ${{ steps.plan.outputs.gloss_minutes }}
    steps:
      - name: Setup repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Decide what to run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          INPUT_CASES: ${{ inputs.cases }}
          INPUT_SEEDS: ${{ inputs.seeds }}
          INPUT_ANIMATE: ${{ inputs.animate }}
          INPUT_SHOWCASES: ${{ inputs.showcases }}
          INPUT_HARD_LANE: ${{ inputs.hard_lane }}
          INPUT_GLOSS: ${{ inputs.gloss }}
        run: |
          run=true
          cases=""
          seeds="0"
          animate=false
          showcases=false
          hard_lane=none
          gloss=false
          if [ "${EVENT}" = pull_request ]; then
            cases="${PR_CASES}"
            changed="$(git diff --name-only "${PR_BASE}...${PR_HEAD}")"
            relevant='^(hardware/pnr/|hardware/tools/scan_via_proximity\.py$|requirements|docker/|tools/ci/|\.github/workflows/ladder\.yaml$)'
            if ! echo "${changed}" | grep -qE "${relevant}"; then
              echo "No engine input changed; the ladder is skipped."
              run=false
            fi
            if [ "${HEAD_REPO}" != "${GITHUB_REPOSITORY}" ]; then
              echo "::notice::Pull requests from forks skip the ladder while the image is private."
              run=false
            fi
          elif [ "${EVENT}" = schedule ]; then
            seeds="0 1"
            animate=true
            showcases=true
            hard_lane="ladder nightly"
            gloss=true
          else
            cases="${INPUT_CASES}"
            seeds="${INPUT_SEEDS:-0}"
            animate="${INPUT_ANIMATE:-false}"
            showcases="${INPUT_SHOWCASES:-false}"
            hard_lane="${INPUT_HARD_LANE:-none}"
            gloss="${INPUT_GLOSS:-false}"
          fi
          # Step budgets (minutes) that fit the job's: the runtime guard may take up to 20,
          # the image pull, summaries and uploads about 10.
          if [ "${EVENT}" = pull_request ]; then
            baseline_minutes=30
            traced_minutes=0
            timeout=60
          elif [ "${animate}" = true ]; then
            baseline_minutes=80
            traced_minutes=40
            timeout=150
          else
            baseline_minutes=120
            traced_minutes=0
            timeout=150
          fi
          # The showcases (about 10 minutes on the development Mac; never measured on the
          # runner) have their own budget, added to the job's only when they run.
          showcase_minutes=0
          if [ "${showcases}" = true ]; then
            showcase_minutes=45
            timeout=$((timeout + showcase_minutes))
          fi
          # The hard rungs' budget is the sum of their own per-seed budgets (ci.minutes in
          # hard_rungs.py, measured on the development Mac) over the lanes run (a space-separated
          # list), added only when a lane runs.
          hard_minutes=0
          if [ "${hard_lane}" != none ]; then
            hard_minutes="$(HARD_LANE="${hard_lane}" python3 -c 'import os, sys
          sys.path.insert(0, "hardware/pnr/regression")
          from hard_rungs import hard_rungs
          print(sum(r["ci"]["minutes"] for r in hard_rungs() if r["ci"]["lane"] in os.environ["HARD_LANE"].split()))')"
            if [ "${hard_minutes}" -gt 90 ]; then
              # GitHub-hosted jobs stop at 360 minutes; the per-seed budgets in hard_rungs.py were
              # measured before the router speed work (the lane takes about 9 CPU minutes on x86).
              hard_minutes=90
            fi
            timeout=$((timeout + hard_minutes))
          fi
          # The gloss stage on two cases (about 4 minutes on the development Mac, gloss included).
          gloss_minutes=0
          if [ "${gloss}" = true ]; then
            gloss_minutes=20
            timeout=$((timeout + gloss_minutes))
          fi
          if [ "${run}" = true ] && [ "${EVENT}" = pull_request ] \
              && echo "${changed}" | grep -E '^docker/yapnr-kicad/' | grep -qvE '\.md$'; then
            echo "::notice::docker/yapnr-kicad changed: the new KiCad base is not published yet," \
              "so the ladder is skipped here (image.yaml smoke-tests the base; the nightly run on" \
              "main covers the ladder after the merge)."
            run=false
          fi
          {
            echo "run=${run}"
            echo "cases=${cases}"
            echo "seeds=${seeds}"
            echo "animate=${animate}"
            echo "showcases=${showcases}"
            echo "gloss=${gloss}"
            echo "timeout=${timeout}"
            echo "baseline_minutes=${baseline_minutes}"
            echo "traced_minutes=${traced_minutes}"
            echo "showcase_minutes=${showcase_minutes}"
            echo "hard_lane=${hard_lane}"
            echo "hard_minutes=${hard_minutes}"
            echo "gloss_minutes=${gloss_minutes}"
          } | tee -a "${GITHUB_OUTPUT}"

  ladder:
    # Not named "ladder": that check name belongs to the aggregate job below.
    name: run the ladder
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: ${{ fromJSON(needs.plan.outputs.timeout) }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the image to a digest
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:edge" --format '{{json .Manifest}}' \
            | jq -r .digest)"
          ref="${IMAGE}@${digest}"
          docker pull --platform linux/arm64 "${ref}"
          echo "LADDER_IMAGE=${ref}" >> "${GITHUB_ENV}"
          echo "Ladder image: \`${ref}\`" >> "${GITHUB_STEP_SUMMARY}"

      # The ladder runs the checkout's sources on the image's runtime. When this checkout pins
      # other versions than the image was built with, install exactly the checkout's lock
      # (hashes, no dependencies) into an overlay venv made from the image's own CPython.
      - name: Runtime guard
        run: |
          mkdir -p out
          listing="import importlib.metadata as m; print('\n'.join(sorted('%s==%s' % (d.metadata['Name'].lower().replace('_', '-'), d.version) for d in m.distributions())))"
          docker run --rm --entrypoint /opt/venv/bin/python "${LADDER_IMAGE}" -c "${listing}" \
            | sort > out/image-runtime.txt
          grep -E '^[A-Za-z0-9_.-]+==' docker/yapnr/runtime-arm64.lock | sed -E 's/ .*//' \
            | tr 'A-Z_' 'a-z-' | sort > out/checkout-runtime.txt
          missing="$(comm -13 out/image-runtime.txt out/checkout-runtime.txt)"
          if [ -z "${missing}" ]; then
            echo "LADDER_PY=/opt/venv/bin/python" >> "${GITHUB_ENV}"
            echo "The image's runtime matches docker/yapnr/runtime-arm64.lock."
          else
            echo "::notice::The checkout pins other runtime versions than the image;" \
              "installing the checkout's lock into an overlay venv: ${missing//$'\n'/ }"
            # The single-quoted script expands inside the container, not here.
            # shellcheck disable=SC2016
            timeout 20m docker run --rm -u "$(id -u):$(id -g)" -v "${PWD}:/work" -w /work \
              --entrypoint /bin/sh "${LADDER_IMAGE}" -c '
                set -eu
                python="$(ls -d /opt/python/cpython-3.11.*/bin/python3 | head -n 1)"
                "${python}" -m venv /work/out/venv
                /work/out/venv/bin/python -m pip install --quiet --no-cache-dir \
                  --require-hashes --no-deps -r docker/yapnr/runtime-arm64.lock'
            echo "LADDER_PY=/work/out/venv/bin/python" >> "${GITHUB_ENV}"
          fi

      # The KiCad tier of the router's unit tests (exact_route_kicad_test in Bazel): routes
      # under the exact pairwise separation, a net class's clearance included, judged by
      # kicad-cli's DRC in the image that has KiCad.
      - name: Exact-separation routes under KiCad's DRC
        timeout-minutes: 15
        run: |
          docker run --rm --init -u "$(id -u):$(id -g)" -v "${PWD}:/work" -w /work/hardware/pnr \
            -e PYTHONPATH=/work/hardware/pnr -e PNR_KICAD_PYTHON=/usr/bin/python3 \
            -e PNR_KICAD_CLI=/usr/bin/kicad-cli \
            --entrypoint /usr/local/bin/yapnr-kicad-env "${LADDER_IMAGE}" \
            "${LADDER_PY}" -m unittest -v tests.test_exact_route_kicad

      # The KiCad tier of the plane partition, IR-drop, pad-local clearance and board-edge
      # tests (their Bazel targets are manual: they need KiCad), run by the image's KiCad
      # Python itself, which has no numpy: the partition and the IR solves go to the
      # ladder's numeric Python (PNR_PYTHON), as pnr.ir_extract and staged_signal do in a
      # run. A KiCad-side defect (an API KiCad 10 dropped, numpy assumed) fails here.
      - name: Supply, pad and edge tests under KiCad's Python
        timeout-minutes: 15
        run: |
          docker run --rm --init -u "$(id -u):$(id -g)" -v "${PWD}:/work" -w /work/hardware/pnr \
            -e PYTHONPATH=/work/hardware/pnr -e PNR_PYTHON="${LADDER_PY}" \
            -e PNR_KICAD_PYTHON=/usr/bin/python3 -e PNR_KICAD_CLI=/usr/bin/kicad-cli \
            --entrypoint /usr/local/bin/yapnr-kicad-env "${LADDER_IMAGE}" \
            /bin/sh -c '/usr/bin/python3 -c "import pcbnew" && /usr/bin/python3 -m unittest -v \
              tests.test_ir_extract_kicad tests.test_plane_partition_kicad \
              tests.test_pad_clearance_kicad tests.test_board_edge_kicad'

      - name: Run the ladder (baseline)
        id: baseline
        env:
          CASES: ${{ needs.plan.outputs.cases }}
          SEEDS: ${{ needs.plan.outputs.seeds }}
          MINUTES: ${{ needs.plan.outputs.baseline_minutes }}
        run: |
          args=()
          for case in ${CASES}; do args+=(--case "${case}"); done
          for seed in ${SEEDS}; do args+=(--seed "${seed}"); done
          status=0
          # Leave the job time for the traced run and the uploads after a hang.
          timeout --kill-after=60 "${MINUTES}m" \
            docker run --rm --init -u "$(id -u):$(id -g)" -v "${PWD}:/work" -w /work \
              --shm-size 1g --entrypoint /usr/local/bin/yapnr-kicad-env "${LADDER_IMAGE}" \
              "${LADDER_PY}" hardware/pnr/regression/run.py --repo /work --out /work/out/ladder \
                --python "${LADDER_PY}" --kicad-python /usr/bin/python3 \
                --kicad-cli /usr/bin/kicad-cli --library /usr/share/kicad/footprints \
                --timeout 600 "${args[@]}" || status=$?
          echo "status=${status}" >> "${GITHUB_OUTPUT}"

      - name: Summary (baseline)
        if: always()
        run: python3 tools/ci/ladder_summary.py out/ladder --title "Regression ladder (baseline)" >> "${GITHUB_STEP_SUMMARY}"

      # The committed animations' options (the opt-in compact placement and gloss stage; each
      # animation's config in docs/animations/manifest.json), so the traces compare with them.
      - name: Run the ladder with traces (initial pool, seed 0)
        if: always() && needs.plan.outputs.animate == 'true'
        env:
          CASES: ${{ needs.plan.outputs.cases }}
          MINUTES: ${{ needs.plan.outputs.traced_minutes }}
        run: |
          args=()
          for case in ${CASES}; do args+=(--case "${case}"); done
          timeout --kill-after=60 "${MINUTES}m" \
            docker run --rm --init -u "$(id -u):$(id -g)" -v "${PWD}:/work" -w /work \
              --shm-size 1g --entrypoint /usr/local/bin/yapnr-kicad-env "${LADDER_IMAGE}" \
              "${LADDER_PY}" hardware/pnr/regression/run.py --repo /work --out /work/out/traced \
                --python "${LADDER_PY}" --kicad-python /usr/bin/python3 \
                --kicad-cli /usr/bin/kicad-cli --library /usr/share/kicad/footprints \
                --timeout 600 --seed 0 --trace --initial-pool --initial-starts 8 \
                --initial-finalists 3 --compact --gloss "${args[@]}" || true
          mkdir -p out/traced
          echo "${LADDER_IMAGE}" > out/traced/image.txt
          python3 tools/ci/ladder_summary.py out/traced --title "Regression ladder (traced, initial pool)" \
            >> "${GITHUB_STEP_SUMMARY}"

      # Informational: the showcases (designs.showcases(), outside the ladder) and 07-chaser-20, the
      # free half of the line-group comparison. A failure or a timeout is a notice, never the job.
      - name: Run the showcases (traced, informational)
        if: always() && needs.plan.outputs.showcases == 'true'
        env:
          MINUTES: ${{ needs.plan.outputs.showcase_minutes }}
        run: |
          status=0
          timeout --kill-after=60 "${MINUTES}m" \
            docker run --rm --init -u "$(id -u):$(id -g)" -v "${PWD}:/work" -w /work \
              --shm-size 1g --entrypoint /usr/local/bin/yapnr-kicad-env "${LADDER_IMAGE}" \
              "${LADDER_PY}" hardware/pnr/regression/run.py --repo /work --out /work/out/showcases \
                --python "${LADDER_PY}" --kicad-python /usr/bin/python3 \
                --kicad-cli /usr/bin/kicad-cli --library /usr/share/kicad/footprints \
                --timeout 1200 --seed 0 --trace --trace-placement-every 5 --initial-pool \
                --initial-starts 8 --initial-finalists 3 --showcases --compact --gloss \
                --case 07-chaser-20 --case line-chaser-20 --case edge-io-12-free \
                --case edge-io-12 --case hier-twin-bank-32 || status=$?
          mkdir -p out/showcases
          echo "${LADDER_IMAGE}" > out/showcases/image.txt
          python3 tools/ci/ladder_summary.py out/showcases --title "Showcases (traced, informational)" \
            >> "${GITHUB_STEP_SUMMARY}" || true
          if [ "${status}" != 0 ]; then
            echo "::notice::the showcases did not all pass (informational: they never decide the job)"
          fi

      # Informational: the hard rungs of the CI lanes given (hardware/pnr/regression/hard_rungs.py),
      # seed 0, with the initial pool. A failure or a timeout is a notice, never the job.
      # --rail-alloc search is the engine's default now (pnr.rail_alloc, #81's A/B); passed
      # explicitly here so the -rails rung's plane_quality check keeps exercising it even if
      # a future run.py invocation elsewhere passes --rail-alloc static.
      - name: Run the hard rungs (informational)
        if: always() && needs.plan.outputs.hard_lane != 'none'
        env:
          LANE: ${{ needs.plan.outputs.hard_lane }}
          MINUTES: ${{ needs.plan.outputs.hard_minutes }}
        run: |
          status=0
          lanes=()
          for lane in ${LANE}; do lanes+=(--lane "${lane}"); done
          timeout --kill-after=60 "${MINUTES}m" \
            docker run --rm --init -u "$(id -u):$(id -g)" -v "${PWD}:/work" -w /work \
              --shm-size 1g --entrypoint /usr/local/bin/yapnr-kicad-env "${LADDER_IMAGE}" \
              "${LADDER_PY}" hardware/pnr/regression/run.py --repo /work --out /work/out/hard \
                --python "${LADDER_PY}" --kicad-python /usr/bin/python3 \
                --kicad-cli /usr/bin/kicad-cli --library /usr/share/kicad/footprints \
                --timeout 3600 --seed 0 --initial-pool --initial-starts 8 --initial-finalists 3 \
                --rail-alloc search \
                "${lanes[@]}" || status=$?
          python3 tools/ci/ladder_summary.py out/hard --title "Hard rungs, lanes: ${LANE} (informational)" \
            >> "${GITHUB_STEP_SUMMARY}" || true
          if [ "${status}" != 0 ]; then
            echo "::notice::the hard rungs did not all pass (informational: they never decide the job)"
          fi

      # PNR_GLOSS is opt-in (default off), so no other run takes the pass: the gloss stage
      # (run.py --gloss, gated by the case's cold DRC) on two cases. A case that fails (a stage
      # error) fails the job; a stage that kept no edit on either case is a warning.
      - name: Run the gloss stage (PNR_GLOSS)
        id: gloss
        if: always() && needs.plan.outputs.gloss == 'true'
        env:
          MINUTES: ${{ needs.plan.outputs.gloss_minutes }}
        run: |
          status=0
          timeout --kill-after=60 "${MINUTES}m" \
            docker run --rm --init -u "$(id -u):$(id -g)" -v "${PWD}:/work" -w /work \
              --shm-size 1g --entrypoint /usr/local/bin/yapnr-kicad-env "${LADDER_IMAGE}" \
              "${LADDER_PY}" hardware/pnr/regression/run.py --repo /work --out /work/out/gloss \
                --python "${LADDER_PY}" --kicad-python /usr/bin/python3 \
                --kicad-cli /usr/bin/kicad-cli --library /usr/share/kicad/footprints \
                --timeout 900 --seed 0 --gloss --gloss-measure \
                --case 04-inverter-leds-8 --case 07-chaser-20 || status=$?
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          python3 tools/ci/ladder_summary.py out/gloss --title "Gloss stage (PNR_GLOSS)" \
            >> "${GITHUB_STEP_SUMMARY}" || true
          if ! grep -qs '"kept": true' out/gloss/*/result.json; then
            echo "::warning::the gloss stage kept no edit on any case"
          fi

      - name: Collect the boards of failed cases
        if: always()
        run: |
          python3 - <<'EOF'
          import json, shutil
          from pathlib import Path
          for run in (Path("out/ladder"), Path("out/traced"), Path("out/showcases"), Path("out/hard"), Path("out/gloss")):
              path = run / "summary.json"
              if not path.is_file():
                  continue
              for result in json.loads(path.read_text()).get("results", []):
                  if result.get("passed"):
                      continue
                  case = run / Path(result["directory"]).name
                  target = Path("out/failed") / run.name / case.name
                  for name in ("routed.kicad_pcb", "routed.kicad_pro", "source.kicad_pcb", "placed.json", "routes.json"):
                      if (case / name).is_file():
                          target.mkdir(parents=True, exist_ok=True)
                          shutil.copy2(case / name, target / name)
          EOF

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ladder-results
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/ladder/summary.json
            out/ladder/junit.xml
            out/ladder/provenance.json
            out/ladder/*-version.txt
            out/ladder/*/result.json
            out/ladder/*/drc.json
            out/ladder/*/*.log
            out/gloss/summary.json
            out/gloss/provenance.json
            out/gloss/*/result.json
            out/gloss/*/gloss/*.drc.json
            out/gloss/*/*.log
            out/failed/

      - name: Upload the traced run
        if: always() && needs.plan.outputs.animate == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ladder-traced
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/traced/summary.json
            out/traced/provenance.json
            out/traced/image.txt
            out/traced/*-version.txt
            out/traced/*/design.json
            out/traced/*/result.json
            out/traced/*/trace/

      - name: Upload the showcase run
        if: always() && needs.plan.outputs.showcases == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ladder-showcases
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/showcases/summary.json
            out/showcases/provenance.json
            out/showcases/image.txt
            out/showcases/*-version.txt
            out/showcases/*/design.json
            out/showcases/*/result.json
            out/showcases/*/trace/

      - name: Upload the hard-rung run
        if: always() && needs.plan.outputs.hard_lane != 'none'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ladder-hard
          retention-days: 14
          if-no-files-found: warn
          path: |
            out/hard/summary.json
            out/hard/provenance.json
            out/hard/*-version.txt
            out/hard/*/result.json
            out/hard/*/drc.json
            out/hard/*/checks.json
            out/hard/*/*.log

      - name: The baseline ladder (and the gloss stage when it ran) decides the job
        env:
          STATUS: ${{ steps.baseline.outputs.status }}
          GLOSS: ${{ needs.plan.outputs.gloss }}
          GLOSS_STATUS: ${{ steps.gloss.outputs.status }}
        run: |
          if [ "${GLOSS}" = true ] && [ "${GLOSS_STATUS:-1}" != 0 ]; then
            echo "::error::the gloss stage failed (status ${GLOSS_STATUS:-none})"
            exit 1
          fi
          exit "${STATUS:-1}"

  animations:
    needs: [plan, ladder]
    if: >-
      always() && needs.ladder.result != 'skipped'
      && (needs.plan.outputs.animate == 'true' || needs.plan.outputs.showcases == 'true')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Setup repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-bazel's own caches are not used: see ci.yaml.
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0

      - name: Point Bazelisk at the cached directory
        run: echo "BAZELISK_HOME=${HOME}/.cache/bazelisk" >> "${GITHUB_ENV}"

      - name: Cache Bazelisk and the Bazel repository cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/bazelisk
            ~/.cache/bazel-repo
          key: bazel-repo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel', 'MODULE.bazel.lock', 'requirements.lock') }}
          restore-keys: bazel-repo-${{ runner.os }}-${{ runner.arch }}-

      - name: Download the traced run
        if: needs.plan.outputs.animate == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ladder-traced
          path: out/traced

      # Catches an incomplete upload (e.g. a path missing from "Upload the traced run") here,
      # with a clear case/file list, instead of a traceback deep inside the renderer below.
      - name: Check the traced run's inputs
        if: needs.plan.outputs.animate == 'true'
        run: |
          python3 tools/ci/check_run_inputs.py out/traced \
            --file design.json --file result.json --dir trace

      - name: Render the animations
        if: needs.plan.outputs.animate == 'true'
        run: |
          image="$(cat out/traced/image.txt 2>/dev/null || true)"
          bazel run //hardware/pnr:ladder_animations --config=ci \
            --repository_cache="$HOME/.cache/bazel-repo" -- \
            --render-only "${GITHUB_WORKSPACE}/out/traced" --out "${GITHUB_WORKSPACE}/out/animations" \
            --allow-failed --image "${image}"

      - name: Download the showcase run
        if: needs.plan.outputs.showcases == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ladder-showcases
          path: out/showcases

      # Informational, like the render step below: an incomplete showcase upload is a notice,
      # not a job failure, but still caught here with a clear case/file list.
      - name: Check the showcase run's inputs
        if: needs.plan.outputs.showcases == 'true'
        run: |
          python3 tools/ci/check_run_inputs.py out/showcases \
            --file design.json --file result.json --dir trace \
            || echo "::notice::the showcase run's inputs are incomplete (informational)"

      # Informational: a showcase that failed or cannot be rendered is a notice.
      - name: Render the showcase animations
        if: needs.plan.outputs.showcases == 'true'
        run: |
          image="$(cat out/showcases/image.txt 2>/dev/null || true)"
          mkdir -p out/animations
          bazel run //hardware/pnr:showcase_animations --config=ci \
            --repository_cache="$HOME/.cache/bazel-repo" -- \
            --render-only "${GITHUB_WORKSPACE}/out/showcases" --out "${GITHUB_WORKSPACE}/out/animations" \
            --allow-failed --image "${image}" \
            || echo "::notice::the showcase animations could not be rendered (informational)"

      # Refreshing docs/animations stays a deliberate change; a drift is a notice, never a failure.
      - name: Compare with the committed animations
        if: needs.plan.outputs.animate == 'true'
        run: |
          python3 - <<'EOF'
          import json
          from pathlib import Path
          committed = Path("docs/animations/manifest.json")
          fresh = json.loads(Path("out/animations/manifest.json").read_text())
          if not committed.is_file():
              print("::notice::docs/animations/manifest.json does not exist yet")
              raise SystemExit(0)
          old = {a["file"]: a.get("trace_sha256") for a in json.loads(committed.read_text())["animations"]}
          new = {a["file"]: a.get("trace_sha256") for a in fresh["animations"]}
          drift = sorted(f for f in new if old.get(f) != new[f])
          if drift:
              print("::notice::the engine's traces differ from the committed animations: " + ", ".join(drift))
          EOF

      - name: Upload the animations
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ladder-animations
          retention-days: 14
          path: out/animations/

  # One result for the workflow (skipped jobs count as success).
  ladder-result:
    name: ladder
    needs: [plan, ladder, animations]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the results
        env:
          RESULTS: ${{ needs.plan.result }} ${{ needs.ladder.result }} ${{ needs.animations.result }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            case "${result}" in
              success | skipped) ;;
              *) echo "::error::a ladder job ended with '${result}'"; exit 1 ;;
            esac
          done
