name: macOS

# Keeps yapnr building and testing on Apple silicon, the main development
# platform (darwin wheels; later the .dylib search backend). Informational:
# this workflow is NOT a required check. A nightly macOS KiCad lane joins it in
# PR6b (docs/migration-plan.md, section 5.2).
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# macOS runner minutes cost about ten times Linux minutes: cancel superseded
# runs on the same ref.
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Setup repository
        uses: actions/checkout@v7

      # setup-bazel's own caches are not used: their keys carry neither the CPU
      # architecture nor the lock files, and its Bazelisk cache is not where
      # .bazeliskrc sends Bazelisk. Both download caches are keyed below.
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0

      # The environment overrides .bazeliskrc (./.bazelisk), so the Bazel
      # binary lands in the cached directory.
      - name: Point Bazelisk at the cached directory
        run: echo "BAZELISK_HOME=${HOME}/.cache/bazelisk" >> "${GITHUB_ENV}"

      - name: Restore Bazel caches
        id: cache
        uses: ./.github/actions/bazel-cache-restore

      - name: Check RF lane inventory
        timeout-minutes: 3
        run: |
          bazel query --config=ci --repository_cache="$HOME/.cache/bazel-repo" 'kind(".*_test rule", //tests/unit/rf/... + //tests/unit/rf_coupons/... + //tests/e2e/rf/...)' --output=xml > "$RUNNER_TEMP/rf-targets.xml"
          python3 tools/ci/check_rf_lanes.py "$RUNNER_TEMP/rf-targets.xml"

      - name: Test
        id: test
        run: >-
          bazel test //... --config=ci
          --disk_cache="$HOME/.cache/bazel-disk"
          --repository_cache="$HOME/.cache/bazel-repo"

      # Explicit saves still run after a completed failed test. They cannot turn it green.
      - name: Save Bazel caches
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        uses: ./.github/actions/bazel-cache-save
        with:
          disk-key: ${{ steps.cache.outputs.disk-key }}
          repo-key: ${{ steps.cache.outputs.repo-key }}
          repo-hit: ${{ steps.cache.outputs.repo-hit }}
