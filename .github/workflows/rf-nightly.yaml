name: RF nightly

# Expensive solver, inverse-design and coupon fitting tests are opt-in on branches.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rf-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rf:
    name: RF (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Setup repository
        uses: actions/checkout@v7
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
      - name: Point Bazelisk at the cached directory
        run: echo "BAZELISK_HOME=${HOME}/.cache/bazelisk" >> "${GITHUB_ENV}"

      - name: Restore Bazel caches
        id: cache
        uses: ./.github/actions/bazel-cache-restore

      - name: Check RF lane inventory
        timeout-minutes: 3
        run: |
          bazel query 'kind(".*_test rule", //tests/unit/rf/... + //tests/unit/rf_coupons/... + //tests/e2e/rf/...)' --output=xml > "$RUNNER_TEMP/rf-targets.xml"
          python3 tools/ci/check_rf_lanes.py "$RUNNER_TEMP/rf-targets.xml"

      - name: Test RF nightly lane
        id: test
        run: >-
          bazel test //tests/unit/rf/... //tests/unit/rf_coupons/... //tests/e2e/rf/...
          --config=ci --config=rf-nightly
          --disk_cache="$HOME/.cache/bazel-disk"
          --repository_cache="$HOME/.cache/bazel-repo"

      # Explicit saves still run after a completed failed test. They cannot turn it green.
      - name: Save Bazel caches
        if: ${{ !cancelled() && (steps.test.outcome == 'success' || steps.test.outcome == 'failure') }}
        uses: ./.github/actions/bazel-cache-save
        with:
          disk-key: ${{ steps.cache.outputs.disk-key }}
          repo-key: ${{ steps.cache.outputs.repo-key }}
          repo-hit: ${{ steps.cache.outputs.repo-hit }}
