# isort settings, read by the pinned prek hook and by any isort run in this
# checkout (isort finds this file from any directory below the root), so the
# import order does not depend on where isort runs. Without it, isort guesses
# first-party packages from its working directory: from the root `pnr` is
# third-party, from hardware/pnr it is first-party.
[settings]
profile = black
line_length = 100
known_first_party = pnr,yapnr,tools
