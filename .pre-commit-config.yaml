# Presubmit hooks, run by prek (https://github.com/j178/prek), a drop-in
# reimplementation of pre-commit that reads this file. Set up a checkout with
# ./setup-precommit.sh; CI runs the same version (.github/workflows/ci.yaml).
#
# Hooks and pinned versions are Splanc's, minus nixpkgs-fmt (no Nix here) and
# Splanc-specific excludes, plus the yapnr privacy scan.
#
# The global exclude is RESERVED for these prefixes only; do not add others:
#   docs/hardware/  the verbatim Splanc import (PR1/PR2), split into the docs
#                   pages in PR7
#   third_party/    vendored upstream files, kept byte-identical
# The privacy scan also runs as a Bazel test over the whole tree
# (//tests/unit/repo:test_privacy_scan), so excluded paths are still scanned.
#
# hardware/ (the imported engine) is formatted and linted since PR3a: the
# Python hooks cover its Python files (flake8 with the per-file baseline in
# .flake8; name-tests-test but for two test helpers).
# Its other files keep a per-hook exclude where the hook would rewrite or
# reject them, until PR3b moves the code out: prettier (Markdown, SI model and
# test data JSON), markdownlint (via .markdownlintignore), buildifier and
# buildifier-lint (BUILD.bazel and pnr.bzl, regenerated in PR3b), and
# trailing-whitespace and end-of-file-fixer (byte-exact test data, the built
# viewer bundle). The other hooks cover all of hardware/.
exclude: ^(docs/hardware/|third_party/)

repos:
  # Python formatting and linting (flake8 settings live in .flake8)
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        language_version: python3
        types: [python]
        args: [--line-length=100]

  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8

  # Shell script linting (shellcheck-py: no docker dependency)
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  # BUILD / .bzl formatting and lint
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 8.2.0
    hooks:
      - id: buildifier
        exclude: ^hardware/
      - id: buildifier-lint
        exclude: ^hardware/

  # Markdown/JSON/YAML formatting and linting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [markdown, json, yaml]
        exclude: ^hardware/

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: [--fix]

  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^hardware/(pnr/testdata/|tools/pnr_live/dist/)
      - id: end-of-file-fixer
        exclude: ^hardware/(pnr/testdata/|tools/pnr_live/dist/)
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=600]
        # Vendored upstream files are reviewed for size when vendored.
        exclude: ^third_party/
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-json
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]
        # Helper modules the engine's tests import; PR3b moves them out of tests/.
        exclude: ^hardware/pnr/tests/(cost_fixture|power_topology_golden)\.py$

  # Keep machine paths, tailnet hosts and addresses, personal e-mail
  # addresses and credentials out of this public repository. Stdlib-only.
  - repo: local
    hooks:
      - id: yapnr-privacy-scan
        name: privacy scan (paths, hosts, addresses, e-mail, tokens)
        language: system
        entry: python3 tools/privacy_scan.py
        types: [text]
