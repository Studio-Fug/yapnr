# radar60 Rev A: yapnr constraints. Generated by gen_board.py from floorplan.yaml: edit that file.
#
# Frame: mm, origin at the board's lower-left corner, +y north (towards the antennas), rot CCW.
# Parts are named by atopile instance path (@...), nets by the schematic's net names (globs);
# floorplan.yaml lists both. Route under
# PNR_FAB_PROFILE=pcbway-adv-6l-rf (stackup pcbway-6l-ro4835-ro4450f); radar60.kicad_dru beside
# the board carries the profile's custom rules and the board's own.
#
# Sections: fixed (U1 in the RF macro's frame, J1 on the south edge, the four mounting-hole
# parts, the floorplan board's two radome standoff lands), keepout / copper_keepout (the RF
# region minus the VOUT_PA pocket), region (J2, J3, PMIC, switch nodes, Y1, the pocket; hard),
# group (decoupling, Y1, buck loops; hard),
# net_class / diff_pair / length_match (routing). rf_macro, noise_keepout and height_limit are
# proposed (radar60 plan 3.4, 7.3, 7.5): the current engine warns and ignores them, and the
# custom rules and the RF audit enforce them meanwhile.

schema: v0
board:
  outline:
    w: 60
    h: 47.35
  layers: 6
  default_clearance_mm: 0.2
  references_on_fab: true
fab:
  track_width_mm: 0.15
fixed:
  '@radio.u1':
    at: [26, 28]
    rot: 270
    side: top
  '@j1':
    edge: south
    align: center
    rot: 0
    side: top
  '@mech.mh[[]0]':
    at: [3.5, 3.5]
    rot: 0
    side: top
  '@mech.mh[[]1]':
    at: [56.5, 3.5]
    rot: 0
    side: top
  '@mech.mh[[]2]':
    at: [3.5, 43.85]
    rot: 0
    side: top
  '@mech.mh[[]3]':
    at: [56.5, 43.85]
    rot: 0
    side: top
  RL1:
    at: [3.5, 27]
    rot: 0
    side: top
  RL2:
    at: [56.5, 27]
    rot: 0
    side: top
  '@debug.j2':
    at: [20.75, 11.5]
    rot: 0
    side: top
  '@debug.j3':
    at: [4.3, 19.5]
    rot: 90
    side: top
orientation:
  '@radio.c_apll': 0
  '@radio.c_vbgap': 0
  '@radio.c_synth': 0
  '@radio.c_xp': 0
  '@radio.c_xm': 180
  '@radio.c_pa': 270
  '@radio.r_pa': 0
  '@radio.c_rf2': 180
  '@flash.r_clk': 180
keepout:
  - name: rf_region_1
    polygon: [[12.599, 33.75], [29.557, 33.75], [29.557, 47.35], [12.599, 47.35]]
  - name: rf_region_2
    polygon: [[12.599, 33.2], [20.25, 33.2], [20.25, 33.75], [12.599, 33.75]]
  - name: rf_region_3
    polygon: [[29.557, 34.2], [31.25, 34.2], [31.25, 47.35], [29.557, 47.35]]
  - name: rf_region_4
    polygon: [[31.25, 33.75], [51.469, 33.75], [51.469, 47.35], [31.25, 47.35]]
  - name: rf_region_5
    polygon: [[31.75, 26.7], [51.469, 26.7], [51.469, 33.75], [31.75, 33.75]]
copper_keepout:
  - name: rf_region_1
    ref: '@radio.u1'
    rect_mm: [-19.35, -13.401, -5.2, 3.557]
  - name: rf_region_2
    ref: '@radio.u1'
    rect_mm: [-19.35, 3.557, -6.2, 5.25]
  - name: rf_region_3
    ref: '@radio.u1'
    rect_mm: [-19.35, 5.25, 1.3, 25.469]
  - name: rf_region_4
    ref: '@radio.u1'
    rect_mm: [-5.2, 5.2, 1.3, 5.25]
region:
  - name: pmic_block
    refs:
      [
        '@pmic.u2',
        '@pmic.l_*',
        '@pmic.c_in*',
        '@pmic.c_out*',
        '@pmic.c_vana',
        '@pmic.r_snb*',
        '@pmic.c_snb*',
        '@pmic.r_sh',
        '@pmic.tp_isns',
        '@pmic.r_fb2*',
        '@pmic.r_clkin*',
        '@pmic.r_en*',
        '@pmic.r_gpio2_ls',
        '@pmic.r_s*',
        '@pmic.r_nint*',
        '@pmic.r_pgood*',
        '@pmic.r_rst',
        '@pmic.c_rst',
      ]
    rect: [38, 2, 58, 26.65]
    hard: true
    reason: 'PMIC block, power-first'
  - name: flash_block
    refs: ['@flash.u3']
    rect: [8.3, 15.75, 19.3, 24.6]
    hard: true
    reason: 'QSPI within about 10 mm'
  - name: efuse_block
    refs: ['@power_in.efuse']
    rect: [6.8, 0.4, 22.5, 7.25]
    hard: true
    reason: 'eFuse next to J1 pins 1-2'
  - name: can_block
    refs: ['@can.u4']
    rect: [31.6, 6.65, 38, 16]
    hard: true
    reason: 'CAN after its ESD, near J1'
  - name: pmic_switching
    refs: ['@pmic.u2', '@pmic.l_b*']
    rect: [41, 2, 58, 21.7]
    hard: true
    reason: 'switch nodes >= 8 mm from Y1 and >= 5 mm from RF'
  - name: crystal
    refs: ['@radio.y1']
    rect: [23.5, 15.75, 30.2, 21.55]
    hard: true
    reason: 'Y1 below B15/C15, outside the RF guard'
  - name: radio_apll
    refs: ['@radio.c_apll']
    rect: [32.1, 25.3, 34.15, 26.45]
    hard: true
    reason: 'VOUT_14APLL cap at A10'
  - name: radio_vbgap
    refs: ['@radio.c_vbgap']
    rect: [32.1, 24.05, 34.15, 25.2]
    hard: true
    reason: 'VBGAP cap at B10'
  - name: radio_synth
    refs: ['@radio.c_synth']
    rect: [32.1, 22.8, 34.15, 23.95]
    hard: true
    reason: 'VOUT_14SYNTH cap at B13'
  - name: xtal_cap_p
    refs: ['@radio.c_xp']
    rect: [29.1, 20.8, 31.15, 21.95]
    hard: true
    reason: 'CLKP load cap below B15'
  - name: xtal_cap_n
    refs: ['@radio.c_xm']
    rect: [26.85, 20.8, 28.9, 21.95]
    hard: true
    reason: 'CLKM load cap below C15'
  - name: pa_cap
    refs: ['@radio.c_pa']
    rect: [30.05, 29.4, 31.2, 31.85]
    hard: true
    reason: 'VOUT_PA 220 nF at A2/B2'
  - name: pa_r
    refs: ['@radio.r_pa']
    rect: [28.6, 31.85, 30.95, 33.2]
    hard: true
    reason: 'PA 0 ohm between D2 and B2'
  - name: rf2_cap
    refs: ['@radio.c_rf2']
    rect: [26.1, 31.85, 28.6, 33.2]
    hard: true
    reason: 'VIN_13RF2 220 nF at C2/D2'
  - name: pa_bulk
    refs: ['@radio.c_pa_10u', '@radio.c_pa_22u', '@radio.c_rf2_10u', '@radio.c_rf2_22u']
    rect: [31.4, 19.5, 37.5, 26.6]
    hard: true
    reason: 'VOUT_PA and VIN_13RF2 bulk, bottom side east of the package'
  - name: radio_west
    refs: ['@radio.c_rf1', '@radio.c_bb[[]*']
    rect: [15, 26, 19.55, 33]
    hard: true
    reason: 'VIN_13RF1 and VIN_18BB caps west of G5-J5 / F5, K5'
  - name: qspi_series
    refs: ['@flash.r_clk']
    rect: [17.85, 24.8, 19.95, 25.95]
    hard: true
    reason: 'QSPI_CLK 22 ohm next to R12'
  - name: connector_esd
    refs: ['@uart.esd', '@can.esd']
    rect: [31.6, 6.65, 38.5, 11]
    hard: true
    reason: 'CAN and UART ESD next to J1 pins 5-8, before the transceiver'
  - name: connector_tvs
    refs: ['@power_in.tvs']
    rect: [12, 0.4, 22.5, 7.25]
    hard: true
    reason: '5 V TVS next to J1 pins 1-2'
side:
  bottom:
    [
      '@radio.c_pa',
      '@radio.r_pa',
      '@radio.c_rf2',
      '@radio.c_pa_10u',
      '@radio.c_pa_22u',
      '@radio.c_rf2_10u',
      '@radio.c_rf2_22u',
    ]
group:
  - members:
      [
        '@radio.c_apll',
        '@radio.c_bb[[]*',
        '@radio.c_clk',
        '@radio.c_diff',
        '@radio.c_dig[[]*',
        '@radio.c_dig_2u2',
        '@radio.c_dig_10n',
        '@radio.c_io18',
        '@radio.c_rf1',
        '@radio.c_sram',
        '@radio.c_synth',
        '@radio.c_vbgap',
        '@radio.c_vco',
        '@radio.c_vio[[]*',
        '@radio.c_vio_2u2',
        '@radio.c_vnwa',
        '@radio.c_pa',
        '@radio.c_rf2',
      ]
    anchor: '@radio.u1'
    radius_mm: 11
    hard: true
  - members: ['@radio.c_*_10u', '@radio.c_*_22u', '@radio.c_*_bulk']
    anchor: '@radio.u1'
    radius_mm: 14
    hard: true
  - members: ['@radio.y1']
    anchor: '@radio.u1'
    radius_mm: 9.5
    hard: true
  - members: ['@pmic.l_b*']
    anchor: '@pmic.u2'
    radius_mm: 8.5
    hard: true
  - members: ['@pmic.c_in[[]*']
    anchor: '@pmic.u2'
    radius_mm: 5
    hard: true
  - members: ['@pmic.r_snb*']
    anchor: '@pmic.u2'
    radius_mm: 7.5
    hard: true
  - members: ['@pmic.c_snb0']
    anchor: '@pmic.r_snb0'
    radius_mm: 2.5
    hard: true
  - members: ['@pmic.c_snb1']
    anchor: '@pmic.r_snb1'
    radius_mm: 2.5
    hard: true
  - members: ['@pmic.c_snb2']
    anchor: '@pmic.r_snb2'
    radius_mm: 2.5
    hard: true
  - members: ['@pmic.c_snb3']
    anchor: '@pmic.r_snb3'
    radius_mm: 2.5
    hard: true
  - members: ['@pmic.c_vana']
    anchor: '@pmic.u2'
    radius_mm: 5
    hard: true
  - members: ['@power_in.r_*', '@power_in.c_itimer', '@power_in.c_dvdt']
    anchor: '@power_in.efuse'
    radius_mm: 8
    hard: true
  - members: ['@power_in.c_in_*', '@power_in.c_sys_*']
    anchor: '@power_in.efuse'
    radius_mm: 10
    hard: true
  - members: ['@can.c_*', '@can.r_*']
    anchor: '@can.u4'
    radius_mm: 7.5
    hard: true
  - members: ['@flash.c_*', '@flash.r_cs_pu', '@flash.r_d2_pu', '@flash.r_d3_pu']
    anchor: '@flash.u3'
    radius_mm: 5.5
    hard: true
  - members: ['@flash.r_clk']
    anchor: '@radio.u1'
    radius_mm: 9.5
    hard: true
  - members: ['@radio.c_xp', '@radio.c_xm']
    anchor: '@radio.u1'
    radius_mm: 9.5
    hard: true
  - members: ['@uart.esd', '@can.esd']
    anchor: '@j1'
    radius_mm: 12
    hard: true
  - members: ['@power_in.tvs']
