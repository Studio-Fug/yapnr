    current_a: 2.5
    budget_mohm: 0.5
    temperature_c: 60
    two_point: false
  - net: '1V0_SH'
    sources:
      '@pmic.r_sh': ['2']
    sinks:
      '@pmic.fb_rf1': ['1']
      '@pmic.fb_rf2_a': ['1']
      '@pmic.fb_rf2_b': ['1']
    current_a: 2.5
    budget_mohm: 0.5
    temperature_c: 60
    two_point: false
pour:
  - layer: B.Cu
    net: GND
    connect: solid
rf_macro:
  ref: '@rf_macro.rfm1'
  frame: '@radio.u1'
  lock: fixed
  layers: [F.Cu, In1.Cu, In2.Cu]
  owns_vias: true
  region:
    [
      [12.599, 33.2, 29.557, 47.35],
      [29.557, 34.2, 31.25, 47.35],
      [31.25, 26.7, 51.469, 47.35],
      [31.2, 26.7, 31.25, 33.2],
    ]
  pocket: [29.557, 33.2, 31.25, 34.2]
noise_keepout:
  - name: sw_to_crystal
    nets: ['PMIC_SW_B*']
    from: '@radio.y1'
    min_distance_mm: 8
  - name: sw_to_rf
    nets: ['PMIC_SW_B*']
    from_region: rf_macro
    min_distance_mm: 5
  - name: digital_to_rf
    layers: [F.Cu, In1.Cu, In2.Cu]
