net_class:
  RF:
    nets: ['RF_RX*', 'RF_TX*']
  XTAL:
    nets: ['XTAL_*']
    clearance_mm: 0.15
  QSPI:
    nets: ['QSPI_*']
  PWR:
    nets: ['1V0_*', '1V2*', '1V8*', '3V3*', '5V_SYS', VIN_5V]
    width_mm: 0.25
    clearance_mm: 0.15
  SW:
    nets: ['PMIC_SW_B*']
    width_mm: 0.6
    clearance_mm: 0.2
  GND:
    nets: [GND]
    plane_layer: In1.Cu
  ANALOG:
    nets:
      [
        'VOUT_14*',
        VBGAP,
        EFUSE_EN_UVLO,
        EFUSE_OVLO,
        EFUSE_PGTH,
        EFUSE_ILM,
        EFUSE_ITIMER,
        EFUSE_DVDT,
        VIO_LS_ON,
        'DAMP_*',
        PMIC_FB_B2,
      ]
  LVDS:
    nets:
      [
        LVDS_TX0_P,
        LVDS_TX0_N,
        LVDS_TX1_P,
        LVDS_TX1_N,
        LVDS_CLK_P,
        LVDS_CLK_N,
        LVDS_FRCLK_P,
        LVDS_FRCLK_N,
      ]
    width_mm: 0.17
    clearance_mm: 0.1
  rail_1v0_rf1:
    nets: ['1V0_RF1']
    plane_layer: In3.Cu
  rail_1v0_rf2:
    nets: ['1V0_RF2']
    plane_layer: In3.Cu
diff_pair:
  - name: lvds_tx0
    p: LVDS_TX0_P
    n: LVDS_TX0_N
    width_mm: 0.17
    gap_mm: 0.18
    skew_mm: 0.1
    layers: [F.Cu]
    max_uncoupled_mm: 3
  - name: lvds_tx1
    p: LVDS_TX1_P
    n: LVDS_TX1_N
    width_mm: 0.17
    gap_mm: 0.18
    skew_mm: 0.1
    layers: [F.Cu]
    max_uncoupled_mm: 3
  - name: lvds_clk
    p: LVDS_CLK_P
    n: LVDS_CLK_N
    width_mm: 0.17
    gap_mm: 0.18
    skew_mm: 0.1
    layers: [F.Cu]
    max_uncoupled_mm: 3
  - name: lvds_frclk
    p: LVDS_FRCLK_P
    n: LVDS_FRCLK_N
    width_mm: 0.17
    gap_mm: 0.18
    skew_mm: 0.1
    layers: [F.Cu]
    max_uncoupled_mm: 3
length_match:
  - name: lvds
    nets:
      [
        LVDS_TX0_P,
        LVDS_TX0_N,
        LVDS_TX1_P,
        LVDS_TX1_N,
        LVDS_CLK_P,
        LVDS_CLK_N,
        LVDS_FRCLK_P,
        LVDS_FRCLK_N,
      ]
    tolerance_mm: 2
plane_partition:
  - layer: In3.Cu
    nets: ['1V0_RF1', '1V0_RF2']
    fill: GND
    split_gap_mm: 0.3
    min_width_mm: 1
    currents:
      '1V0_RF1': 2.5
      '1V0_RF2': 2.5
    budgets_mohm:
      '1V0_RF1': 4
      '1V0_RF2': 4
    sources:
      '1V0_RF1':
        '@pmic.fb_rf1': '2'
      '1V0_RF2':
        '@pmic.fb_rf2_a': '2'
ir_drop:
  - net: '1V0_RF1'
    sources:
      '@pmic.fb_rf1': ['2']
    sinks:
      '@radio.u1': [G5, H5, J5]
    current_a: 2.5
    budget_mohm: 4
    temperature_c: 60
    two_point: false
  - net: '1V0_RF2'
    sources:
      '@pmic.fb_rf2_a': ['2']
      '@pmic.fb_rf2_b': ['2']
    sinks:
