net_class:
  RF:
    nets: ['RF_RX*', 'RF_TX*']
  XTAL:
    nets: ['XTAL_*']
    clearance_mm: 0.15
  QSPI:
    nets: ['QSPI_*']
  PWR:
    nets: ['1V0_*', '1V2*', '1V8*', '3V3*', '5V_SYS', VIN_5V]
    width_mm: 0.25
    clearance_mm: 0.15
  SW:
    nets: ['PMIC_SW_B*']
    width_mm: 0.6
    clearance_mm: 0.2
  GND:
    nets: [GND]
    plane_layer: In1.Cu
  ANALOG:
    nets:
      [
        'VOUT_14*',
        VBGAP,
        EFUSE_EN_UVLO,
        EFUSE_OVLO,
        EFUSE_PGTH,
        EFUSE_ILM,
        EFUSE_ITIMER,
        EFUSE_DVDT,
        VIO_LS_ON,
        'DAMP_*',
        PMIC_FB_B2,
      ]
  LVDS:
    nets:
      [
        LVDS_TX0_P,
        LVDS_TX0_N,
        LVDS_TX1_P,
        LVDS_TX1_N,
        LVDS_CLK_P,
        LVDS_CLK_N,
        LVDS_FRCLK_P,
        LVDS_FRCLK_N,
      ]
    width_mm: 0.17
    clearance_mm: 0.1
diff_pair:
  - name: lvds_tx0
    p: LVDS_TX0_P
    n: LVDS_TX0_N
    width_mm: 0.17
    gap_mm: 0.18
    skew_mm: 0.1
  - name: lvds_tx1
    p: LVDS_TX1_P
    n: LVDS_TX1_N
    width_mm: 0.17
    gap_mm: 0.18
    skew_mm: 0.1
  - name: lvds_clk
    p: LVDS_CLK_P
    n: LVDS_CLK_N
    width_mm: 0.17
    gap_mm: 0.18
    skew_mm: 0.1
  - name: lvds_frclk
    p: LVDS_FRCLK_P
    n: LVDS_FRCLK_N
    width_mm: 0.17
    gap_mm: 0.18
    skew_mm: 0.1
length_match:
  - name: lvds
    nets:
      [
        LVDS_TX0_P,
        LVDS_TX0_N,
        LVDS_TX1_P,
        LVDS_TX1_N,
        LVDS_CLK_P,
        LVDS_CLK_N,
        LVDS_FRCLK_P,
        LVDS_FRCLK_N,
      ]
    tolerance_mm: 2
rf_macro:
  ref: '@rf_macro.rfm1'
  frame: '@radio.u1'
  lock: fixed
  layers: [F.Cu, In1.Cu, In2.Cu]
  owns_vias: true
  region:
    [
      [12.599, 33.2, 29.557, 47.35],
      [29.557, 34.2, 31.25, 47.35],
      [31.25, 26.7, 51.469, 47.35],
      [31.2, 26.7, 31.25, 33.2],
    ]
  pocket: [29.557, 33.2, 31.25, 34.2]
noise_keepout:
  - name: sw_to_crystal
    nets: ['PMIC_SW_B*']
    from: '@radio.y1'
    min_distance_mm: 8
  - name: sw_to_rf
    nets: ['PMIC_SW_B*']
    from_region: rf_macro
    min_distance_mm: 5
  - name: digital_to_rf
    layers: [F.Cu, In1.Cu, In2.Cu]
    from_region: rf_macro
    min_distance_mm: 5
    except_classes: [RF, PWR, GND, ANALOG]
height_limit:
  rule: radome_visibility
  angle_deg: 30
  from_copper: [[17.599, 37.963, 30.759, 42.014], [35.651, 36.075, 46.469, 40.125]]
