      '@radio.r_pa': ['1']
    current_a: 2.5
    budget_mohm: 4
    temperature_c: 60
    two_point: false
  - net: '1V2'
    sources:
      '@pmic.fb_1v2': ['2']
    sinks:
      '@radio.u1': [G15, H15, N11, P14, P15, R6]
    current_a: 1
    budget_mohm: 12
    temperature_c: 60
    two_point: false
  - net: '1V8'
    sources:
      '@pmic.fb_1v8': ['2']
    sinks:
      '@radio.u1': [B11, B12, D15, F5, K5, R9]
    current_a: 0.85
    budget_mohm: 21
    temperature_c: 60
    two_point: false
  - net: '3V3_RADIO_IO'
    sources:
      '@radio.u6': ['6']
    sinks:
      '@radio.u1': [F15, R10]
    current_a: 0.2
    budget_mohm: 165
    temperature_c: 60
    two_point: false
  - net: '3V3'
    sources:
      '@pmic.l_b0': ['2']
    current_a: 0.2
    budget_mohm: 165
    temperature_c: 60
    two_point: false
  - net: '5V_SYS'
    sources:
      '@power_in.efuse': ['6']
