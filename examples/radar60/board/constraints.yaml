# radar60 Rev A: yapnr constraints. Generated by gen_board.py from floorplan.yaml: edit that file.
#
# Frame: mm, origin at the board's lower-left corner, +y north (towards the antennas), rot CCW.
# Parts are named by atopile instance path (@...), nets by the schematic's net names (globs);
# floorplan.yaml lists both. Route under
# PNR_FAB_PROFILE=pcbway-adv-6l-rf (stackup pcbway-6l-ro4835-ro4450f); radar60.kicad_dru beside
# the board carries the profile's custom rules and the board's own.
#
# Sections: fixed (U1 in the RF macro's frame, J1 on the south edge), mounting_hole (holes and
# radome lands), keepout / copper_keepout (the RF region minus the VOUT_PA pocket), region (J2,
# J3, PMIC, switch nodes, Y1, the pocket; hard), group (decoupling, Y1, buck loops; hard),
# net_class / diff_pair / length_match (routing). rf_macro, noise_keepout and height_limit are
# proposed (radar60 plan 3.4, 7.3, 7.5): the current engine warns and ignores them, and the
# custom rules and the RF audit enforce them meanwhile.

schema: v0
board:
  outline:
    w: 60
    h: 46
  layers: 6
  default_clearance_mm: 0.2
  references_on_fab: true
fab:
  track_width_mm: 0.15
fixed:
  '@radio.u1':
    at: [26, 28]
    rot: 270
    side: top
  '@j1':
    edge: south
    align: center
    rot: 0
    side: top
mounting_hole:
  - name: H1
    at: [3.5, 3.5]
    drill_mm: 2.7
    clearance_diameter_mm: 6.5
  - name: H2
    at: [56.5, 3.5]
    drill_mm: 2.7
    clearance_diameter_mm: 6.5
  - name: H3
    at: [3.5, 42.5]
    drill_mm: 2.7
    clearance_diameter_mm: 6.5
  - name: H4
    at: [56.5, 42.5]
    drill_mm: 2.7
    clearance_diameter_mm: 6.5
  - name: radome_w
    at: [3.5, 27]
    drill_mm: 3
    clearance_diameter_mm: 5
  - name: radome_e
    at: [56.5, 27]
    drill_mm: 3
    clearance_diameter_mm: 5
keepout:
  - name: rf_region_1
    polygon: ['(16.0, 33.2)', '(29.563, 33.2)', '(29.563, 46.0)', '(16.0, 46.0)']
  - name: rf_region_2
    polygon: ['(29.563, 35.0)', '(31.25, 35.0)', '(31.25, 46.0)', '(29.563, 46.0)']
  - name: rf_region_3
    polygon: ['(31.25, 26.8)', '(44.5, 26.8)', '(44.5, 46.0)', '(31.25, 46.0)']
  - name: rf_region_4
    polygon: ['(31.2, 26.8)', '(31.25, 26.8)', '(31.25, 33.2)', '(31.2, 33.2)']
copper_keepout:
  - name: rf_region_1
    ref: '@radio.u1'
    rect_mm: [-18, -10, -5.2, 3.563]
  - name: rf_region_2
    ref: '@radio.u1'
    rect_mm: [-18, 3.563, -7, 5.25]
  - name: rf_region_3
    ref: '@radio.u1'
    rect_mm: [-18, 5.25, 1.2, 18.5]
  - name: rf_region_4
    ref: '@radio.u1'
    rect_mm: [-5.2, 5.2, 1.2, 5.25]
region:
  - name: lvds_header
    refs: ['@debug.j2']
    rect: [10, 4, 42, 18]
    hard: true
    reason: 'J2 south of the LVDS balls (columns 14/15 face south)'
  - name: jtag
    refs: ['@debug.j3']
    rect: [1, 18, 14, 30]
    hard: true
    reason: 'J3 west of U1 on the JTAG/UART side, below the radome line'
  - name: pmic_block
    refs: ['@pmic.*']
    rect: [36, 2, 58, 24]
    hard: true
    reason: 'PMIC block, power-first'
  - name: pmic_switching
    refs: ['@pmic.u2', '@pmic.l_b*']
    rect: [41, 2, 58, 21.8]
    hard: true
    reason: 'switch nodes >= 8 mm from Y1 and >= 5 mm from RF'
  - name: crystal
    refs: ['@radio.y1', '@radio.c_xp', '@radio.c_xm']
    rect: [26, 17.5, 31.2, 22.6]
    hard: true
    reason: 'Y1 next to B15/C15, outside the RF guard'
  - name: pa_pocket
    refs: ['@radio.c_pa', '@radio.c_rf2']
    rect: [29.563, 33.2, 31.25, 35]
    hard: true
    reason: 'RFM1 pocket for the VOUT_PA caps'
group:
  - members: ['@radio.c_*']
    anchor: '@radio.u1'
    radius_mm: 9
    hard: true
  - members: ['@radio.y1']
    anchor: '@radio.u1'
    radius_mm: 7
    hard: true
  - members: ['@pmic.l_b*']
    anchor: '@pmic.u2'
    radius_mm: 4
    hard: true
net_class:
  RF:
    nets: ['RF_RX*', 'RF_TX*']
  XTAL:
    nets: ['XTAL_*']
    clearance_mm: 0.15
  QSPI:
    nets: ['QSPI_*']
  PWR:
    nets: ['1V0_*', '1V2*', '1V8*', '3V3*', '5V_SYS', VIN_5V]
    width_mm: 0.25
    clearance_mm: 0.15
  SW:
    nets: ['PMIC_SW_B*']
    width_mm: 0.6
    clearance_mm: 0.2
  GND:
    nets: [GND]
    plane_layer: In1.Cu
  LVDS:
    nets:
      [
        LVDS_TX0_P,
        LVDS_TX0_N,
        LVDS_TX1_P,
        LVDS_TX1_N,
        LVDS_CLK_P,
        LVDS_CLK_N,
        LVDS_FRCLK_P,
        LVDS_FRCLK_N,
      ]
    width_mm: 0.17
    clearance_mm: 0.1
diff_pair:
  - name: lvds_tx0
    p: LVDS_TX0_P
    n: LVDS_TX0_N
    width_mm: 0.17
    gap_mm: 0.18
    skew_mm: 0.1
  - name: lvds_tx1
    p: LVDS_TX1_P
    n: LVDS_TX1_N
    width_mm: 0.17
    gap_mm: 0.18
    skew_mm: 0.1
  - name: lvds_clk
    p: LVDS_CLK_P
    n: LVDS_CLK_N
    width_mm: 0.17
    gap_mm: 0.18
    skew_mm: 0.1
  - name: lvds_frclk
    p: LVDS_FRCLK_P
    n: LVDS_FRCLK_N
    width_mm: 0.17
    gap_mm: 0.18
    skew_mm: 0.1
length_match:
  - name: lvds
    nets:
      [
        LVDS_TX0_P,
        LVDS_TX0_N,
        LVDS_TX1_P,
        LVDS_TX1_N,
        LVDS_CLK_P,
        LVDS_CLK_N,
        LVDS_FRCLK_P,
        LVDS_FRCLK_N,
      ]
    tolerance_mm: 2
rf_macro:
  ref: '@rf_macro.rfm1'
  frame: '@radio.u1'
  lock: fixed
  layers: [F.Cu, In1.Cu, In2.Cu]
  owns_vias: true
  region:
    [
      [16, 33.2, 29.563, 46],
      [29.563, 35, 31.25, 46],
      [31.25, 26.8, 44.5, 46],
      [31.2, 26.8, 31.25, 33.2],
    ]
  pocket: [29.563, 33.2, 31.25, 35]
noise_keepout:
  - name: sw_to_crystal
    nets: ['PMIC_SW_B*']
    from: '@radio.y1'
    min_distance_mm: 8
  - name: sw_to_rf
    nets: ['PMIC_SW_B*']
    from_region: rf_macro
    min_distance_mm: 5
  - name: digital_to_rf
    layers: [F.Cu, In1.Cu, In2.Cu]
    from_region: rf_macro
    min_distance_mm: 5
    except_classes: [RF, PWR, GND]
height_limit:
  rule: radome_visibility
  angle_deg: 30
  from_copper: [[19.941, 36.905, 28.417, 40.995], [34.446, 34.745, 40.58, 38.835]]
