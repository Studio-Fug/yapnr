# radar60 Rev A floorplan: the single source of the board track's geometry.
#
# gen_board.py turns this file into constraints.yaml (yapnr), radar60.kicad_pcb (the outline,
# mounting holes and named rule areas), radar60.kicad_pro (net classes, design rules) and
# radar60.kicad_dru (KiCad custom rules). Edit this file, then run `python3 gen_board.py`.
#
# Frame: millimetres, origin at the board's lower-left corner, +x east, +y north (towards the
# antennas), rotations in degrees counter-clockwise (yapnr's frame, docs/hardware/pnr-inputs.md).
# Numbers marked [D] are derived in the radar60 plan (board-design.md, sections 5 and 7), not
# measured; [E] marks a planning allowance.

board:
  width: 60.0 # [D] fits the 100 x 70 mm envelope (SYS-05) with enclosure walls
  # 47.35 (RF uniformity, 2026-10-04): the RF macro's region ends at y 47.024 (4.0 mm of ground
  # beyond the RX cut-out, which holds the RXD0/RXD5 dummy columns and sits 0.20 mm further north
  # for the RX lines' 0.40 mm tail), and copper keeps 0.3 mm from the edge: the record's
  # board_frame.board_height_min is 47.349 [D]. Was 46.3 (review 2026-10-03).
  height: 47.35
  corner_radius: 1.0
  copper_layers: 6
  profile: pcbway-adv-6l-rf # yapnr/fab/data/profiles
  stackup: pcbway-6l-ro4835-ro4450f
  sides: single # bottom side only if the decoupling-loop audit fails top-only (plan 4.2)
  # Layer roles (plan 4.1): In1 GND (RF reference), In2 GND under the RF region and escape
  # signals elsewhere, In3 power pours, In4 GND, F/B signals.
  planes: { In1.Cu: GND, In4.Cu: GND }
  # Router switches (yapnr stage 3b/3c, opt-in): net class clearances in the maze (PWR, XTAL,
  # SW, LVDS), the board's custom rules where they constrain routing (no vias on XTAL/RF,
  # LVDS on F.Cu only (plan R4), SW-XTAL 8 mm, SW-RF 5 mm, In1/In4 track-free, hole to edge),
  # the board's own rounded outline, and the declared LVDS diff pairs routed coupled from
  # their fanout exits (plan R4/E5) instead of each leg alone.
  routing: { class_clearance: maze, dru_routing: true, edge: exact, route_pairs: coupled }

# In3.Cu (typed power): a plane partition for the two 2.5 A core rails (stage 3b power track:
# 1V2 and 1V8 interleave with them round U1, so they stay drop nets with traces); the rest of
# In3 is GND. Each rail's trunk is rooted at its ferrite. The IR-drop report covers every rail
# (design 2.7: copper only, source pad -> sinks, at the annotated peak, 60 C) [D].
power:
  layer: In3.Cu
  # Stage 3c R3: In3 typed power, partitioned by current in the plan's order (1V0_RF1, then
  # 1V0_RF2 with 1V0_PA, 1V2, 1V8, 5V_SYS, 1V0_SH; 3V3_RADIO_IO stays a trace at 0.2 A against
  # 165 mOhm). `order: listed` keeps that order; `fixed_lands`: a fixed block's own-net pads and
  # zones on In3 (the RF macro's 1V0_PA tie, the power stage's drops) are the rails' terminals.
  partition:
    nets: [1V0_RF1, 1V0_RF2, 1V0_PA, 1V2, 1V8, 5V_SYS, 1V0_SH]
    order: listed
    fill: GND
    split_gap_mm: 0.3
    min_width_mm: 1.0
    fixed_lands: true
    # Owner Q2 default (local sensing): 1V0_SH's 0.5 mOhm stays in its ir_drop report, as a
    # quantified warning, but does not size its In3 trunk (R_sq L / 0.5 mOhm would claim most of
    # In3 over the ~20 mm to the ferrites) [D].
    no_budget: [1V0_SH]
    sources:
      {
        1V0_RF1: { pmic.fb_rf1: '2' },
        1V0_RF2: { pmic.fb_rf2_a: '2' },
        1V0_PA: { radio.r_pa: '2' },
        1V2: { pmic.fb_1v2: '2' },
        1V8: { pmic.fb_1v8: '2' },
        5V_SYS: { power_in.efuse: '6' },
        1V0_SH: { pmic.r_sh: '2' },
      }
  temperature_c: 60
  rails:
    1V0_RF1:
      {
        sources: { pmic.fb_rf1: ['2'] },
        sinks: { radio.u1: [G5, H5, J5] },
        current_a: 2.5,
        budget_mohm: 4.0,
      }
    1V0_RF2:
      sources: { pmic.fb_rf2_a: ['2'], pmic.fb_rf2_b: ['2'] }
      sinks: { radio.u1: [C2, D2], radio.r_pa: ['1'] }
      current_a: 2.5
      budget_mohm: 4.0
    1V2:
      {
        sources: { pmic.fb_1v2: ['2'] },
        sinks: { radio.u1: [G15, H15, N11, P14, P15, R6] },
        current_a: 1.0,
        budget_mohm: 12.0,
      }
    1V8:
      {
        sources: { pmic.fb_1v8: ['2'] },
        sinks: { radio.u1: [B11, B12, D15, F5, K5, R9] },
        current_a: 0.85,
        budget_mohm: 21.0,
      }
    3V3_RADIO_IO:
      {
        sources: { radio.u6: ['6'] },
        sinks: { radio.u1: [F15, R10] },
        current_a: 0.2,
        budget_mohm: 165.0,
      }
    3V3: { sources: { pmic.l_b0: ['2'] }, current_a: 0.2, budget_mohm: 165.0 }
    5V_SYS: { sources: { power_in.efuse: ['6'] }, current_a: 1.5, budget_mohm: 33.0 }
    # 1V0_BUCK + 1V0_SH share the design's 1 mOhm: half each [D]
    1V0_BUCK:
      {
        sources: { pmic.l_b2: ['2'] },
        sinks: { pmic.r_sh: ['1'] },
        current_a: 2.5,
        budget_mohm: 0.5,
      }
    1V0_SH:
      sources: { pmic.r_sh: ['2'] }
      sinks: { pmic.fb_rf1: ['1'], pmic.fb_rf2_a: ['1'], pmic.fb_rf2_b: ['1'] }
      current_a: 2.5
      budget_mohm: 0.5

# R8: a GND flood on B.Cu, the fallback for the bottom-site decoupling caps (pa_cap, pa_r,
# rf2_cap, pa_bulk, the QSPI/xtal series parts) and the connectors (J1/J3), whose GND pads the
# fanout plan does not escape to an inner plane the way a top-side pad is. `connect: solid`
# (not the thermal default): wave 2's first try at the default left 2 bottom-site caps
# (C38.2, C63.2) with only 1 of the 2 spokes a thermal pad needs (`starved_thermal`) -- small
# SMD GND pads on a flood with no reflow-isolation requirement, so a full connection is the
# correct fix, not a loosened limit. stitch/clearance/width still match the fab profile
# (pnr-inputs.md "pour"); without this section nothing changes, so it is additive to today's
# routing.
pour: [{ layer: B.Cu, net: GND, connect: solid }]

# Instance paths (atopile addresses) of the parts this file constrains: the interface to the
# schematic track (examples/radar60/schematic, elec/src). Change a path here if the source names
# it differently; every generated file follows. Globs match within the address.
parts:
  radio: radio.u1 # U1 (fixed designator), IWR6843AQGABLR, FCBGA-161 (same lands as fcbga161.py)
  # The radio block's capacitors in three sets (each cap in exactly one; integrate.py checks):
  # high-frequency decoupling next to the package, bulk farther out, the crystal's load caps.
  # Instance paths with an index are written as fnmatch patterns ('c_bb[[]*' matches c_bb[0]).
  radio_decoupling_hf:
    [
      radio.c_apll,
      'radio.c_bb[[]*',
      radio.c_clk,
      radio.c_diff,
      'radio.c_dig[[]*',
      radio.c_dig_2u2,
      radio.c_dig_10n,
      radio.c_io18,
      radio.c_rf1,
      radio.c_sram,
      radio.c_synth,
      radio.c_vbgap,
      radio.c_vco,
      'radio.c_vio[[]*',
      radio.c_vio_2u2,
      radio.c_vnwa,
      radio.c_pa,
      radio.c_rf2,
    ]
  radio_decoupling_bulk: ['radio.c_*_10u', 'radio.c_*_22u', 'radio.c_*_bulk'] # 0603/0805 bulk
  # the 0402 VOUT_PA / VIN_13RF2 caps and the 0 ohm PA feed (ISK Rev D R1), at the corner balls
  # A2/B2 and C2/D2 (see regions.pa_corner)
  pa_decoupling: [radio.c_pa, radio.c_rf2, radio.r_pa]
  # Pin-anchored sets (review 2026-10-03): U1 is fixed, so a region next to the balls a part
  # serves bounds its pad-to-ball distance; audit.py measures it (pin_distance).
  # East edge, south of the TX region: the internal-LDO outputs A10 (APLL) and B13 (SYNTH) and
  # VBGAP B10, one ball-anchored slot each (see regions); the CLK and VCO 220 nF at B11/B12 stay
  # in the HF group
  radio_east: [radio.c_apll, radio.c_synth, radio.c_vbgap]
  radio_apll: radio.c_apll
  radio_vbgap: radio.c_vbgap
  radio_synth: radio.c_synth
  xtal_cap_p: radio.c_xp
  xtal_cap_n: radio.c_xm
  pa_cap: radio.c_pa
  pa_r: radio.r_pa
  rf2_cap: radio.c_rf2
  # VOUT_PA (A2/B2) and VIN_13RF2 (C2/D2) bulk: the nearest free area is the bottom side east of
  # the package, below the TX region (top side there is radio_east)
  pa_bulk: [radio.c_pa_10u, radio.c_pa_22u, radio.c_rf2_10u, radio.c_rf2_22u]
  # VIN_13RF1 (G5/H5/J5) and VIN_18BB (F5/K5) are interior balls of the north half: the nearest
  # top-side area is west of the package (north and east are the RF region). Their bulk caps stay
  # in the bulk group (a region for all six left no legal slot in 4 of 4 starts)
  radio_west: ['radio.c_rf1', 'radio.c_bb[[]*']
  qspi_series: flash.r_clk # QSPI_CLK 22 ohm at the source, ball R12 (west edge)
  crystal: radio.y1 # Y1, 40 MHz 3225
  crystal_caps: [radio.c_xp, radio.c_xm] # Y1 load capacitors
  pmic: pmic.u2 # U2, LP87524J
  pmic_inductors: pmic.l_b* # L1-L4 (switch nodes)
  # The PMIC block: U2, inductors, input/output caps, snubbers, shunt, pulls. Its LC filters
  # (beads and their caps) and the damping options are not: with them the block region failed
  # in 4 of 8 starts once Buck2/3 took the larger IHLP-1616 (review 2026-10-03) [D]
  pmic_parts:
    [
      'pmic.u2',
      'pmic.l_*',
      'pmic.c_in*',
      'pmic.c_out*',
      'pmic.c_vana',
      'pmic.r_snb*',
      'pmic.c_snb*',
      'pmic.r_sh',
      'pmic.tp_isns',
      'pmic.r_fb2*',
      'pmic.r_clkin*',
      'pmic.r_en*',
      'pmic.r_gpio2_ls',
      'pmic.r_s*',
      'pmic.r_nint*',
      'pmic.r_pgood*',
      'pmic.r_rst',
      'pmic.c_rst',
    ]
  pmic_filters: ['pmic.fb_*', 'pmic.c_1v*', 'pmic.c_rf*'] # bead LC filters to the radio rails
  connector: j1 # J1, JST GH-8 right angle on the south edge (pins 1-2 5 V, 3-4 GND, 5-6 CAN, 7-8 UART)
  lvds_header: debug.j2 # J2, Samtec QTH-030 (development builds)
  jtag: debug.j3 # J3, 10-pin 1.27 mm (DNP)
  flash: flash.u3 # U3, QSPI flash
  holes: ['mech.mh[0]', 'mech.mh[1]', 'mech.mh[2]', 'mech.mh[3]'] # 4 x M2.5, in mounting_holes.at order
  rf_macro: rf_macro.rfm1 # RFM1 (yapnr.rf macro footprint; designator prefix RFM)
  # Connector-side protection and the small blocks' support parts. Integration 2026-10-03 left
  # them free and the placer spread them up to 40 mm from their IC (their nets are the board's
  # supply and ground, which pull nothing); the review puts each block in a hard group.
  connector_esd: [uart.esd, can.esd] # D2, D1: ESD next to J1's UART and CAN pins (5-8)
  connector_tvs: power_in.tvs # D3: TVS next to J1's 5 V pins (1-2)
  efuse: power_in.efuse # U5
  # threshold and timer network: high-impedance comparator inputs (UVLO, OVLO, PGTH, ILM, ITIMER)
  efuse_parts: ['power_in.r_*', 'power_in.c_itimer', 'power_in.c_dvdt']
  efuse_caps: ['power_in.c_in_*', 'power_in.c_sys_*'] # input and 5V_SYS capacitors
  can_xcvr: can.u4 # U4
  can_parts: ['can.c_*', 'can.r_*']
  flash_parts: ['flash.c_*', 'flash.r_cs_pu', 'flash.r_d2_pu', 'flash.r_d3_pu']
  dca_reset: debug.r_dca_rst # J2's reset option (0 ohm, DNP)
  pmic_in_caps: 'pmic.c_in[[]*' # 4 x 10 uF at VIN_B0..B3 (SNVSAW2B 8.2.1.2: as close as possible)
  pmic_snubbers: ['pmic.r_snb*', 'pmic.c_snb*'] # 3.9 ohm + 390 pF on each switch node (8.2.1.4)
  pmic_snub_r: 'pmic.r_snb*' # the snubber resistors (on the switch nodes)
  snb_r0: pmic.r_snb0
  snb_r1: pmic.r_snb1
  snb_r2: pmic.r_snb2
  snb_r3: pmic.r_snb3
  snb_c0: pmic.c_snb0
  snb_c1: pmic.c_snb1
  snb_c2: pmic.c_snb2
  snb_c3: pmic.c_snb3
  pmic_vana: pmic.c_vana # 100 nF at VANA (8.2.1.5)
  # ANA#17A damping options (DNP) on the radio rails: not part of the PMIC block region
  supply_damping: ['pmic.r_damp_*', 'pmic.c_damp_*']
  # Pad-anchored groups (stage 3b): each damping RC at its ferrite's rail pad, the rail ferrites
  # at the balls they feed, each snubber resistor at its inductor's switch-node pad
  damp_r_rf1: pmic.r_damp_rf1
  damp_c_rf1: pmic.c_damp_rf1
  damp_r_rf2: pmic.r_damp_rf2
  damp_c_rf2: pmic.c_damp_rf2
  damp_r_1v8: pmic.r_damp_1v8
  damp_c_1v8: pmic.c_damp_1v8
  fb_rf1: pmic.fb_rf1 # 1V0_SH -> 1V0_RF1 (G5, H5, J5)
  fb_rf2: ['pmic.fb_rf2_a', 'pmic.fb_rf2_b'] # 1V0_SH -> 1V0_RF2 (C2, D2), in parallel
  fb_rf2_a: pmic.fb_rf2_a
  fb_1v8: pmic.fb_1v8
  l_b0: pmic.l_b0
  l_b1: pmic.l_b1
  l_b2: pmic.l_b2
  l_b3: pmic.l_b3
  pmic_tp: pmic.tp_isns # TP1, the Kelvin sense pads across R_SH1
  r_sh: pmic.r_sh # R_SH1, the 2.5 A Kelvin current-sense shunt (1V0_BUCK -> 1V0_SH). Not R46:
  # R46 is radio.r_pa, the separate 1V0_RF2 -> 1V0_PA feed resistor (stage3c owner Q1), a
  # different part on a different rail (review 2026-10-05, stage3c wave-1 finding #4).

# Net classes by net-name glob (the schematic's suggested names). The class names are the ones
# radar60.kicad_dru tests.
nets:
  RF: { globs: [RF_RX*, RF_TX*] } # TX1-TX3, RX1-RX4 (SWRS219F 6.2.2)
  XTAL: { globs: [XTAL_*] } # CLKP, CLKM
  QSPI: { globs: [QSPI_*] } # CLK, CS_N, D0-D3
  LVDS: # (p, n) per lane; development builds only
    pairs:
      lvds_tx0: [LVDS_TX0_P, LVDS_TX0_N]
      lvds_tx1: [LVDS_TX1_P, LVDS_TX1_N]
      lvds_clk: [LVDS_CLK_P, LVDS_CLK_N]
      lvds_frclk: [LVDS_FRCLK_P, LVDS_FRCLK_N]
  PWR: { globs: [1V0_*, 1V2*, 1V8*, 3V3*, 5V_SYS, VIN_5V] }
  SW: { globs: [PMIC_SW_B*] } # the four buck switch nodes
  GND: { globs: [GND] }
  # Analog DC nodes (review 2026-10-03): the radio's internal-LDO and band-gap capacitors, the
  # eFuse threshold and timer network, the load-switch enable, the damping nodes and the buck
  # feedback. Not digital: R4 (no digital copper next to the RF region) exempts them, as it does
  # RF, PWR and GND, in the custom rules and in audit.py alike.
  ANALOG:
    {
      globs:
        [
          VOUT_14*,
          VBGAP,
          EFUSE_EN_UVLO,
          EFUSE_OVLO,
          EFUSE_PGTH,
          EFUSE_ILM,
          EFUSE_ITIMER,
          EFUSE_DVDT,
          VIO_LS_ON,
          DAMP_*,
          PMIC_FB_B2,
        ],
    }

lvds: # 100 ohm edge-coupled microstrip on F.Cu over In1.Cu (RO4835 4 mil): 99-103 ohm for Dk 3.33-3.66 [D]
  width: 0.17
  gap: 0.18
  skew_mm: 0.1 # within a pair (plan 3.4 @pnr-pair)
  group_skew_mm: 2.0 # across the four pairs
  max_uncoupled_mm: 3.0 # plan R4: the DRU's own diff_pair_uncoupled cap, declared so E5 enforces it
qspi_max_length_mm: 25.0 # plan 3.4 @pnr-si

u1:
  ref: U1 # the radio's reference designator in the routed board (rules name it)
  at: [26.0, 28.0] # [D] plan 5.1
  rot: 270 # RX edge (ball column 2) north, TX edge (row B) east
  body_mm: 10.4
  # the schematic's ABL0161B footprint: courtyard 0.5 mm beyond the body (IPC-7351B least,
  # review 2026-10-03; it was 1.0), plus its stroke
  courtyard_mm: 11.5

connector: # J1 GH-8 (SM08B-GHS-TB, schematic O18) on the south edge, centred at x = 30, entry south (plan 5.1)
  x: 30.0
  rot: 0 # the stock footprint's mating face points +y in KiCad (south here): verify on the part
  height_mm: 4.25

mounting_holes: # 4 x M2.5, plated, GND (plan 5.1; the schematic's MountingHole_2.7mm_M2.5_Pad)
  drill: 2.7
  pad: 5.4
  keepout_diameter: 6.5
  # 3.5 mm from each corner of the 60 x 47.35 mm outline
  at: [[3.5, 3.5], [56.5, 3.5], [3.5, 43.85], [56.5, 43.85]]

radome_lands: # standoff lands for the north-only test radome (plan 5.4, review) [D]
  diameter: 3.0
  keepout_diameter: 5.0
  at: [[3.5, 27.0], [56.5, 27.0]]

rf:
  macro_ref: RFM1 # reference of the RF macro footprint (generated in U1's frame, plan 6)
  # The RF track's macro (examples/radar60/rf, rfm1-n): the RF-uniformity layout of 2026-10-04
  # (guard band, straight run-ins, terminated dummy columns at all four bank ends, the TX bank
  # 3.55 mm further east). These values are the record's board_frame, and
  # `gen_board.py --macro` checks them against it (and against the D12 siblings rfm1-m/-p).
  macro_record: ../rf/generated/rfm1-n/rfm1-n.json
  patches: # patch copper extents with the dummy columns, for the radome rule (plan 5.2 had rx 21.0-29.7 x 35.2-39.6)
    rx: [17.599, 37.963, 30.759, 42.014]
    tx: [35.651, 36.075, 46.469, 40.125]
  # RF region (plan 5.2): (a) the RX fan, (b) the TX feeds and bank, plus a 5 mm ground margin
  # beyond the cut-outs (west of RX, east of TX: the macro's own pour, x 12.599-51.469); the
  # TX side starts at the macro's pour edge (y 26.7, U1 y -1.3); the VOUT_PA pocket is cut out
  # of it down to the package edge. `gen_board.py --macro` checks that every macro item outside
  # the package body lies in the region or the pocket.
  region: # [x0, y0, x1, y1] rectangles whose union is the region minus the pocket
    - [12.599, 33.2, 29.557, 47.35] # RX fan and the west ground margin
    - [29.557, 34.2, 31.25, 47.35] # above the pocket
    - [31.25, 26.7, 51.469, 47.35] # TX launches, feeds, bank and the east ground margin
    - [31.2, 26.7, 31.25, 33.2] # the sliver between the package edge and the pocket's east side
  # macro's VOUT_PA pocket (y from 33.45; 1.69 x 0.75 mm, between RX4's corridor, TX1's and RL2's
  # load cell): no part fits (an 0402 courtyard is 1.91 x 1.01 mm), so the VOUT_PA / VIN_13RF2
  # parts stay on the bottom side (pa_cap, pa_r, rf2_cap); down to the package edge
  pocket: [29.557, 33.2, 31.25, 34.2]
  # R4 (plan 7.5): no digital net within 5 mm of RF copper on F.Cu-In2.Cu. A rectangular 5 mm
  # band around the region, without the package body (the radio's own balls and escapes) and
  # without the region itself; the RF audit (E6) measures the exact distance.
  guard_mm: 5.0
  guard: # [x0, y0, x1, y1]
    - [7.599, 28.2, 12.599, 47.35] # west of the ground margin
    - [12.599, 28.2, 20.8, 33.2] # south of the RX fan, west of the package
    - [31.2, 21.7, 56.469, 26.7] # south of the TX region, east of the package
    - [51.469, 26.7, 56.469, 47.35] # east of the TX bank
  fence_via: { drill: 0.15, diameter: 0.32, min_pitch: 0.45 } # RFS-5; 11 mil hole to hole
  # The macro as the engine's fixed_block: integrate.py merges it into the source board in U1's
  # frame and groups every item; its In2.Cu GND pour is a solid obstacle to foreign vias.
  block: { name: rfm1, group: RFM1_MACRO, solid_layers: [In2.Cu] }

noise: # plan 3.4 noise budget and 7.5 R4
  sw_to_crystal_mm: 8.0
  sw_to_rf_mm: 5.0

# U1's escape plan (yapnr `fanout`; stage 3a trial 2's entry, fanout track T1 variant A with the
# review fixes). integrate.py plans it before placement (U1 fixed, with the macro's copper) and
# turns every surface exit into a placement keepout (`exit_bands`), so no part sits in front of
# an escaping ball; `bottom_sites` become fixed bottom poses under the array.
fanout:
  name: u1
  # The seven RF balls belong to the macro. A2/B2 (VOUT_PA) have no legal via site under the
  # current rules (stage 3a 5.3); D14: macro v2 owns their feed (stage 3c), so they are skipped.
  skip_pads: [B4, B6, B8, F2, H2, K2, M2, A2, B2]
  via_classes:
    ground: { diameter_mm: 0.35, drill_mm: 0.15, nets: [GND], sites: [interstitial, outside] }
    # radar60.kicad_dru: crystal nets take no via, LVDS stays on F.Cu only (plan R4: a coupled
    # pair that drops to B.Cu loses its reference plane and its partner), supply and signal
    # vias under U1 are 0.40/0.20
    xtal: { diameter_mm: 0.4, drill_mm: 0.2, nets: ['XTAL_*'], layers: [F.Cu] }
    lvds:
      {
        diameter_mm: 0.4,
        drill_mm: 0.2,
        nets: ['LVDS_*'],
        sites: [vacant, outside],
        layers: [F.Cu],
      }
    supply:
      {
        diameter_mm: 0.4,
        drill_mm: 0.2,
        nets: [1V0_PA, 1V0_RF1, 1V0_RF2, 1V2, 1V8, 3V3_RADIO_IO, VBGAP, VOUT_14APLL, VOUT_14SYNTH],
        sites: [vacant, outside],
      }
    default: { diameter_mm: 0.4, drill_mm: 0.2, sites: [vacant, outside] }
  surface_rings: 2
  forbidden_exits: [north, east]
  neck_mm: 0.1
  neck_classes: [LVDS]
  # supplies and the LDO outputs drop a via beside the ball (decoupled under the array)
  # instead of escaping; 1V0_RF1 and 1V0_RF2 are In3 plane nets (power.partition)
  drop_nets: [1V0_PA, 1V2, 1V8, 3V3_RADIO_IO, VBGAP, VOUT_14APLL, VOUT_14SYNTH]
  lock: true
  # A ball whose plan fails no longer blocks its net: bridged to a same-net neighbour, else
  # given to the board's escapes, else reported open (yapnr stage 3b).
  partial: { bridge: true }
  # Bottom-side decoupling sites under the array, in priority order (trial 2 placed 6 of 9;
  # the VOUT_PA corner parts keep their bottom regions until macro v2 puts its pocket vias in)
  bottom_sites:
    parts: [radio.c_vbgap, radio.c_apll, radio.c_synth, radio.c_rf1, radio.c_sram, radio.c_vco]
    max_stub_mm: 1.0
    zone: shadow
    rotations: [0, 90]
  # integrate.py: each surface exit becomes a strip this wide, from the exit to this far beyond
  # U1's courtyard (the router's tail turns within 2 mm); touching strips merge [D]
  exit_bands: { width_mm: 0.5, beyond_courtyard_mm: 2.5 }

# The flash's exposed pad (Macronix PM2257 rev. 1.4, drawing 6110-3401: 3.40 x 4.00 mm, GND or
# floating): no vias or traces under it. A copper keepout in U3's frame (integrate.py, routing).
flash_ep: { rect_mm: [-1.7, -2.0, 1.7, 2.0] }

# Legalizer options (yapnr `legalize`, opt-in): the outline is not a whole number of 0.25 mm
# slots (47.35 mm), and J2, J3 and the ball-anchored slots are window parts (stage 3a: 27/32
# legal starts with these against fewer without).
legalize: { outline: exact, order: scarcity, lookahead: regions }

# Placement regions (plan 5.1, 7.3); yapnr `region` constraints, hard.
regions:
  # J2 (development connector) is a region part again (stage 3b): its stage-2 fixed pose predates
  # the parts track's QTH land (rows at +-3.086 mm) and the 47.35 mm board. Its 20.59 x 8.24 mm
  # body has about 5 mm of play along x, between the eFuse block and the flash and crystal
  # blocks (y >= 15.75), under the crystal region; the legalizer's 0.25 mm slots need about
  # 0.5 mm of play across, so the window reaches 0.3 mm into the eFuse block's (y 6.95) [D]
  # (8.35 mm, the first try, left J2 no slot in 4 of 4 starts). With `order: scarcity` it is
  # placed before the roomy blocks.
  lvds_header:
    {
      parts: [lvds_header],
      rect: [8.0, 6.95, 34.0, 15.7],
      reason: 'J2 above J1, below the flash and Y1',
    }
  # J3 (JTAG, DNP) at the west edge: below the radome land RL1's keepout (y <= 24.5) and above
  # MH1's (y >= 6.75), west of the flash block (x <= 8.4); only its upright turn fits [D].
  jtag: { parts: [jtag], rect: [0.5, 8.0, 8.4, 24.3], reason: 'J3 at the west edge' }
  # Plan 5.1 gives y 18-40; the radome rule keeps a 5 mm header 8.7 mm from the RX patches, and
  # the R4 guard band starts at y 28.2 west of the RX margin, so the region stops at y 28.2; the
  # west radome land (3.5, 27) takes its north-west corner, so it reaches down to y 8 [D]
  # (gen_board.py --radome).
  # Plan 5.1 gives x 36-58, y 2-24. The block (without its LC filters) now runs from x 38, to
  # leave x 31.6-38 north-east of J1 to the protection and the CAN block, and up to y 26.65
  # (the east guard band takes PWR parts) [D]: 493 mm2, as before.
  pmic_block:
    { parts: [pmic_parts], rect: [38.0, 2.0, 58.0, 26.65], reason: 'PMIC block, power-first' }
  # Block anchors (review 2026-10-03: with the block groups the search put the flash 33 mm from
  # its balls (QSPI <= 25 mm routed), the CAN transceiver 20 mm and the eFuse 31 mm from J1):
  # the flash west of U1 (QSPI balls R12-P12 on the west edge, x 21.45-22.75, y 24.1-25.4),
  # between J3 and the radio's west caps, above J2; the eFuse (and its TVS) west of J1 below J2,
  # next to J1's 5 V pins 1-2; the CAN transceiver north-east of J1, beyond its ESD diode [D].
  flash_block: { parts: [flash], rect: [8.3, 15.75, 19.3, 24.6], reason: 'QSPI within about 10 mm' }
  efuse_block: { parts: [efuse], rect: [6.8, 0.4, 22.5, 7.25], reason: 'eFuse next to J1 pins 1-2' }
  can_block:
    { parts: [can_xcvr], rect: [31.6, 6.65, 38.0, 16.0], reason: 'CAN after its ESD, near J1' }
  # The switch nodes keep >= 8 mm from the crystal zone (x <= 32.4) and >= 5 mm from the RF
  # region (y <= 21.7): x >= 41 gives 8.6 mm, y <= 21.7 gives 5.0 mm, by construction [D].
  pmic_switching:
    {
      parts: [pmic, pmic_inductors],
      rect: [41.0, 2.0, 58.0, 21.7],
      reason: 'switch nodes >= 8 mm from Y1 and >= 5 mm from RF',
    }
  # Y1 south of CLKP/CLKM (B15/C15 at (29.9, 23.45)/(29.25, 23.45)), below its load caps and
  # east of the SPIA exit band (E15, x <= 28.2; stage 3b: the old region x 23.5-30.2 stood in
  # front of the LVDS and SPIA exits, the trial's no-access balls), above J2 (y >= 15.75). Only
  # its flat turn fits (4.29 x 3.59 mm in 4.6 x 3.95). Its pads stay 8.5 mm or more from the
  # switch region (x >= 41) [D].
  crystal:
    {
      parts: [crystal],
      rect: [28.4, 15.75, 33.0, 19.7],
      reason: 'Y1 below its load caps, east of the exit bands',
    }
  # Ball-anchored slots (review 2026-10-03; `slot: true`: integrate.py refuses a slot that meets
  # another net's exit band). The legalizer works on a 0.25 mm grid with 0.2 mm
  # courtyard clearance, so an 0402 (courtyard 1.91 x 1.01 mm) takes a 2.25 x 1.25 mm slot. U1's
  # courtyard (0.5 mm beyond the body) blocks up to x 32.0 east of it and down to y 22.0 below
  # it; the TX region blocks y >= 26.5 east of it. Each rect bounds one part's courtyard to one
  # slot, and an orientation (`orientations`) turns its signal pad (pad 1) toward the ball [D]:
  # APLL cap, pad (32.645, 25.875), 2.25 mm from A10 (30.55, 26.7)
  radio_apll:
    {
      parts: [radio_apll],
      slot: true,
      rect: [32.1, 25.3, 34.15, 26.45],
      reason: 'VOUT_14APLL cap at A10',
    }
  # VBGAP cap, pad (32.645, 24.625), 3.44 mm from B10 (29.9, 26.7)
  radio_vbgap:
    {
      parts: [radio_vbgap],
      slot: true,
      rect: [32.1, 24.05, 34.15, 25.2],
      reason: 'VBGAP cap at B10',
    }
  # SYNTH cap, pad (32.645, 23.375), 3.07 mm from B13 (29.9, 24.75)
  radio_synth:
    {
      parts: [radio_synth],
      slot: true,
      rect: [32.1, 22.8, 34.15, 23.95],
      reason: 'VOUT_14SYNTH cap at B13',
    }
  # Crystal load caps below CLKP (B15 at 29.9) and CLKM (C15 at 29.25), y 23.45 (SWRS219F
  # 7.12.2: as close as possible). Stage 3b: each may sit only in its own ball's exit band (B15
  # 29.65-30.15, C15 29.0-29.5), never in the SPIA band (E15, x <= 28.2: the old CLKM slot
  # x 26.85-28.9 blocked it). The CLKM cap upright (pad 1 north) over C15's band, the CLKP cap
  # flat (pad 1 west) east of C15's band and below the R4 guard band (y <= 21.7 east of x 31.2):
  # pads about (28.9, 21.46) and (30.12, 21.0), 2.0 and 2.5 mm from their balls [D].
  xtal_cap_p:
    {
      parts: [xtal_cap_p],
      slot: true,
      rect: [29.5, 20.3, 31.7, 21.7],
      reason: 'CLKP load cap below B15',
    }
  xtal_cap_n:
    {
      parts: [xtal_cap_n],
      slot: true,
      rect: [28.2, 19.9, 29.6, 22.05],
      reason: 'CLKM load cap below C15',
    }
  # VOUT_PA (A2/B2), VIN_13RF2 (C2/D2) and the PA 0 ohm feed on the bottom side under the corner
  # (balls at x 28.6-30.55, y 31.9; the pocket holds no 0402 courtyard, not even with a 0.5 mm
  # U1 courtyard: 1.69 mm wide against 1.91). The macro's launch vias stand at y 31.575 (RX,
  # x <= 27.625) and x 29.575 (TX, y <= 30.925); the parts keep 0.275 mm from their centres:
  # the 220 nF VOUT_PA cap upright east of the TX launch vias (pad 1 north, 0.6 mm from A2), the
  # 0 ohm between C2/D2 and A2/B2 above the RX launch row, the 220 nF VIN_13RF2 cap west of it
  # (pad 1 east, under D2) [D]. Their vias are E4 inputs: reserve them before the fanout.
  pa_cap:
    {
      parts: [pa_cap],
      slot: true,
      rect: [30.05, 29.4, 31.2, 31.85],
      side: bottom,
      reason: 'VOUT_PA 220 nF at A2/B2',
    }
  pa_r:
    {
      parts: [pa_r],
      slot: true,
      rect: [28.6, 31.85, 30.95, 33.2],
      side: bottom,
      reason: 'PA 0 ohm between D2 and B2',
    }
  rf2_cap:
    {
      parts: [rf2_cap],
      slot: true,
      rect: [26.1, 31.85, 28.6, 33.2],
      side: bottom,
      reason: 'VIN_13RF2 220 nF at C2/D2',
    }
  # The load capacitors straight below B15/C15 (SWRS219F 7.12.2: as close as possible): a cap
  # centre at y <= 21.08 puts its pad about 2.4 mm from the balls (review 2026-10-03) [D].
  # The macro's VOUT_PA pocket (1.69 x 0.75 mm since the RF-uniformity layout, 2026-10-04; it
  # was 1.69 x 1.55) holds no 0402 courtyard (1.91 x 1.01 mm), and a 0.5 mm courtyard would not
  # either (1.86 mm wide against 1.69 mm). Plan 5.2's double-sided branch: the caps and the 0 ohm
  # PA feed go on the bottom side under the VOUT_PA / VIN_13RF2 corner (balls A2, B2, C2, D2 at
  # x 28.6-30.55, y 31.9), outside the RF region [D] (integration and review, 2026-10-03).
  # The macro's launch vias (through, 0.35 mm, rfm1-n) stand at y 31.575 (RX, x <= 27.625) and
  # x 29.575 (TX, y <= 30.925) under the corner; the area keeps 0.275 mm from their centres
  # (0.1 mm via to SMD pad beyond the via copper), an L of two rectangles [D]. The vias these
  # three parts need are E4 inputs: reserve them before the fanout.
  # East edge below the TX region: A10 (30.55, 26.7), B10-B13 (29.9, 26.7-24.75); x >= 32.3
  # clears U1's courtyard, y <= 26.65 the TX region. Pads land 2-3 mm from their balls [D].
  # Bottom side under and below radio_east, the nearest area to A2/B2 and C2/D2 outside the BGA
  # shadow and the RF region: 6-11 mm from the balls. Within 8 mm there are about 8 mm2 per side
  # outside the package, against about 27 mm2 for the four caps [D]; nearer needs the BGA-shadow
  # bottom side (E4 co-design) or fewer caps (review finding 7's option).
  pa_bulk:
    {
      parts: [pa_bulk],
      rect: [31.4, 19.5, 37.5, 26.6],
      side: bottom,
      reason: 'VOUT_PA and VIN_13RF2 bulk, bottom side east of the package',
    }
  # West of the package (x <= 19.55: U1's courtyard and clearance), PWR/GND parts in the guard band
  radio_west:
    {
      parts: [radio_west],
      rect: [15.0, 26.0, 19.55, 33.0],
      reason: 'VIN_13RF1 and VIN_18BB caps west of G5-J5 / F5, K5',
    }
  # The QSPI clock's series resistor at the source, R12 (21.45, 25.4), below the R4 guard
  # (y < 28.2). Stage 3b: the west exit bands of R12's neighbours (P10, P12, R13: x 17.75-20.25
  # at the 0.325 mm exit pitch) leave no 0402 room in front of R12, so the slot is just west of
  # them; pad 1 (QSPI_CLK, east) about 4.5 mm from the ball, against 2.1 mm before (at 80 MHz
  # about 30 ps more stub) [D]
  qspi_series:
    {
      parts: [qspi_series],
      slot: true,
      rect: [15.4, 24.8, 17.55, 25.95],
      reason: 'QSPI_CLK 22 ohm west of the R12 exit bands',
    }
  # Protection at J1 (review 2026-10-03: the ESD diodes sat 27-32 mm away, behind the CAN
  # transceiver). J1's pins 5-8 (CAN, UART) are at x 30.6-34.4, y 5.1; north of them is J2's
  # courtyard up to x 31.3, so the ESD diodes go north-east of the pins. Pins 1-2 (5 V) are at
  # x 25.6-26.9; the TVS goes west of J1 (J2 above).
  connector_esd:
    {
      parts: [connector_esd],
      rect: [31.6, 6.65, 38.5, 11.0],
      reason: 'CAN and UART ESD next to J1 pins 5-8, before the transceiver',
    }
  connector_tvs:
    { parts: [connector_tvs], rect: [12.0, 0.4, 22.5, 7.25], reason: '5 V TVS next to J1 pins 1-2' }

# Fixed rotations (yapnr `orientation`, hard) for the ball-anchored parts above: pad 1 (the
# signal side of every cap and resistor here) toward the ball. Rotation CCW in the board frame;
# an 0402 at 0 has pad 1 west [D].
orientations:
  radio_apll: 0
  radio_vbgap: 0
  radio_synth: 0
  xtal_cap_p: 0
  xtal_cap_n: 270
  pa_cap: 270
  pa_r: 0
  rf2_cap: 180
  qspi_series: 180

groups: # hard proximity, centre to centre (pnr.place.geometry.hard_group_edges)
  # U1's courtyard reaches 6.25 mm from its centre: an 0402 centre comes no closer than 6.95 mm
  # (courtyard, 0.2 mm clearance, half the cap), and a 9 mm radius leaves four 2 mm strips with
  # no corners, about 17 caps of room against 18 caps plus the radio's free parts. 10.5 mm opens
  # the corners (6.95 mm on both axes is 9.83 mm out): caps within about 5 mm of the package
  # edge on top. The ball-anchored sets above narrow this for the parts the review named.
  radio_decoupling_hf:
    {
      anchor: radio,
      members: [radio_decoupling_hf],
      radius_mm: 11.0,
      reason: 'within about 5 mm of the package edge',
    }
  # The bulk caps (10-22 uF) serve below about 10 MHz; with all 35 radio caps inside 9 mm the
  # ring around U1 (outside its courtyard, the RF region and the crystal block, about 104 mm2)
  # is smaller than the caps' courtyards with clearance (about 124 mm2) [D].
  radio_decoupling_bulk:
    {
      anchor: radio,
      members: [radio_decoupling_bulk],
      radius_mm: 14.0,
      reason: 'bulk within about 9 mm of the package edge',
    }
  # Y1 below its load caps (stage 3b, y <= 19.7) is at least 10.2 mm from U1's centre inside
  # the crystal region (11.3 at its middle): the plan's 7 mm cannot be met [D].
  crystal:
    {
      anchor: radio,
      members: [crystal],
      radius_mm: 12.5,
      reason: 'Y1 within about 3 mm of B15/C15 (4.55 mm south of U1 centre)',
    }
  # U2's courtyard is 6.14 x 6.64 mm. Buck2 and Buck3 now use the IHLP-1616BZ (courtyard
  # 6.23 x 4.65 mm): its centre comes no closer than 5.9 mm. Inductors, the four input caps, the
  # eight snubber parts and VANA take about 125 mm2 with clearance; inside 7.5 mm of U2's centre
  # there are 136 mm2 (no legal start), inside 8.5 mm 186 mm2 [D].
  pmic: { anchor: pmic, members: [pmic_inductors], radius_mm: 8.5, reason: 'buck loops' }
  # Review 2026-10-03: input caps, snubbers and VANA next to U2 (they sat 3.8-13 mm away). An
  # 0805 centre comes no closer than 4.3 mm (courtyard 3.07 + 0.2 + 0.98), an 0402 3.7 mm [D].
  pmic_in_caps:
    { anchor: pmic, members: [pmic_in_caps], radius_mm: 5.0, reason: 'CIN at VIN_Bx/PGND_Bx' }
  # Each snubber resistor at its inductor's switch-node pad (pad 1), measured from that pad
  # (stage 3b; was 7.5 mm from U2's centre). 3.5 mm: at 3.0 only 8 of 32 starts were legal [D].
  snb_l0:
    { anchor: l_b0, anchor_pad: '1', members: [snb_r0], radius_mm: 3.5, reason: 'snubber at SW_B0' }
  snb_l1:
    { anchor: l_b1, anchor_pad: '1', members: [snb_r1], radius_mm: 3.5, reason: 'snubber at SW_B1' }
  snb_l2:
    { anchor: l_b2, anchor_pad: '1', members: [snb_r2], radius_mm: 3.5, reason: 'snubber at SW_B2' }
  snb_l3:
    { anchor: l_b3, anchor_pad: '1', members: [snb_r3], radius_mm: 3.5, reason: 'snubber at SW_B3' }
  # each snubber's capacitor next to its resistor (one placement put a pair 9.9 mm apart when
  # both were only tied to U2) [D]
  snb0: { anchor: snb_r0, members: [snb_c0], radius_mm: 2.5, reason: 'snubber R-C pair' }
  snb1: { anchor: snb_r1, members: [snb_c1], radius_mm: 2.5, reason: 'snubber R-C pair' }
  snb2: { anchor: snb_r2, members: [snb_c2], radius_mm: 2.5, reason: 'snubber R-C pair' }
  snb3: { anchor: snb_r3, members: [snb_c3], radius_mm: 2.5, reason: 'snubber R-C pair' }
  pmic_vana: { anchor: pmic, members: [pmic_vana], radius_mm: 5.0, reason: 'VANA filter cap' }
  # Rail ferrites near the balls they feed (stage 3b, from the IR budget: the 1.0 V branches
  # have about 4 mOhm of copper from the ferrite to the worst ball, about 15 mm of In3 at
  # 2.7 mm width), measured from the ball [D]
  fb_rf1:
    {
      anchor: radio,
      anchor_pad: H5,
      members: [fb_rf1],
      radius_mm: 12.0,
      reason: '1V0_RF1 ferrite within 12 mm of G5/H5/J5',
    }
  fb_rf2:
    {
      anchor: radio,
      anchor_pad: D2,
      members: [fb_rf2],
      radius_mm: 10.0,
      reason: '1V0_RF2 ferrites within 10 mm of C2/D2',
    }
  # R_SH (R_SH1, the 2.5 A Kelvin current-sense shunt feeding 1V0_SH from the buck; not R46,
  # which is radio.r_pa on 1V0_RF2 -> 1V0_PA): close to L_b2:2 so the 0.5 mOhm 1V0_BUCK/1V0_SH
  # budgets (plan stage 3c owner Q2) aren't spent on copper before the sense point (plan stage
  # 3c R2; no anchor existed, and the un-anchored placement put it 17.3 mm away). The radius is
  # to R_SH1's centre: L_b2:2 sits 1.23 mm inside the IHLP-1616's courtyard (pad x 1.89, edge
  # 3.115), so with 0.2 mm courtyard clearance and R_SH1's 1.9 mm half width beside it the
  # nearest centre is 3.32 mm away; 2.0 left no legal slot (stage 3c R1 block trials: "R_SH1:
  # no free slot inside hard group radius"). 4.0 is that plus a 0.25 mm slot and rotation play:
  # the pads then face each other across about 0.8 mm of copper [D].
  r_sh:
    {
      anchor: l_b2,
      anchor_pad: '2',
      members: [r_sh],
      radius_mm: 4.0,
      reason: '1V0_BUCK -> R_SH1 beside L_b2:2 (about 0.8 mm copper gap)',
    }
  # The damping options (ANA#17A, DNP) at their ferrite's rail pad, each capacitor at its
  # resistor's damping pad (pad 2) [D]
  damp_rf1:
    {
      anchor: fb_rf1,
      anchor_pad: '2',
      members: [damp_r_rf1],
      radius_mm: 3.0,
      reason: 'RF1 damping R at the ferrite',
    }
  damp_rf2:
    {
      anchor: fb_rf2_a,
      anchor_pad: '2',
      members: [damp_r_rf2],
      radius_mm: 3.0,
      reason: 'RF2 damping R at the ferrite',
    }
  damp_1v8:
    {
      anchor: fb_1v8,
      anchor_pad: '2',
      members: [damp_r_1v8],
      radius_mm: 3.0,
      reason: '1V8 damping R at the ferrite',
    }
  damp_c_rf1:
    {
      anchor: damp_r_rf1,
      anchor_pad: '2',
      members: [damp_c_rf1],
      radius_mm: 2.0,
      reason: 'RF1 damping C at its R',
    }
  damp_c_rf2:
    {
      anchor: damp_r_rf2,
      anchor_pad: '2',
      members: [damp_c_rf2],
      radius_mm: 2.0,
      reason: 'RF2 damping C at its R',
    }
  damp_c_1v8:
    {
      anchor: damp_r_1v8,
      anchor_pad: '2',
      members: [damp_c_1v8],
      radius_mm: 2.0,
      reason: '1V8 damping C at its R',
    }
  # Blocks (review 2026-10-03; held back at integration because the legalizer stranded J2,
  # which is fixed now). Radii [D]: the anchor's courtyard half width + 0.2 mm + the members'.
  # U5's courtyard is 4.14 mm square; 11 threshold/timer parts within 5.5 mm failed 4 of 8 starts
  # Soft since stage 3c R1 (`hard: false`): U5 is in the eFuse block (power_stage below) and its
  # 11 threshold/timer parts would make that block too big for the strip west of J1 (15.9 x 6.55
  # mm under J2); a hard group may not straddle a rigid block, so they ride as an attraction to
  # it, placed flat beside it.
  efuse:
    {
      anchor: efuse,
      members: [efuse_parts],
      radius_mm: 8.0,
      hard: false,
      reason: 'eFuse thresholds',
    }
  efuse_caps: { anchor: efuse, members: [efuse_caps], radius_mm: 10.0, reason: 'eFuse in/out caps' }
  can: { anchor: can_xcvr, members: [can_parts], radius_mm: 7.5, reason: 'CAN transceiver block' }
  flash:
    { anchor: flash, members: [flash_parts], radius_mm: 5.5, reason: 'flash decoupling, pulls' }
  # Region-only parts are placed after every grouped block, which can take their few slots
  # (the QSPI resistor's strip lost in 4 of 8 starts): these groups only put them in the radio's
  # block, where the legalizer orders parts by their free slots; the regions bound them.
  qspi_series:
    { anchor: radio, members: [qspi_series], radius_mm: 11.0, reason: 'order: radio block' }
  crystal_caps:
    { anchor: radio, members: [crystal_caps], radius_mm: 9.5, reason: 'order: radio block' }
  # The protection parts join J1's block, so the legalizer places them before unrelated blocks
  # take the strip next to J1 (their regions bound them; these radii only order them).
  connector_esd:
    { anchor: connector, members: [connector_esd], radius_mm: 12.0, reason: 'ESD at J1' }
  # Stage 3c R1: D3 at the eFuse input inside the eFuse block (was: anchored on J1, which a
  # rigid block cannot carry: a hard group with members inside and outside it straddles it).
  # Its region (connector_tvs above) still keeps it beside J1's 5 V pins.
  connector_tvs:
    { anchor: efuse, members: [connector_tvs], radius_mm: 6.0, reason: 'TVS at the eFuse input' }
  # Stage 3c R1: the Kelvin TP joins R_SH1 in the power-stage block.
  r_sh_tp: { anchor: r_sh, members: [pmic_tp], radius_mm: 4.0, reason: 'Kelvin TP at R_SH1' }

# Radome visibility (plan 5.2, R5): no part above a 30 degree line from the nearest patch edge,
# i.e. a part of height h stays >= h / tan(30 deg) = 1.73 h from the patch copper.
radome:
  angle_deg: 30.0
  test_radome_south_y: 27.0 # the test radome covers y >= 27 (plan 5.4)
  # [E] part heights, mm (IHLP-1616BZ: 2.0 mm max, Vishay 34196)
  heights: { connector: 4.25, lvds_header: 4.3, jtag: 5.0, pmic_inductors: 2.0 }

# Probe and documentation only: where U1's signal escapes may leave the package (plan 7.2).
escape:
  forbidden_edges: [north, east] # the RF edges carry only RF, GND and power balls

# Stage 3c R1: the power-stage subcells (power_block.py). Each block is the one pnr.hier.blocks
# extracts around its `anchor` (the hard groups above); `contains` names the roles it must hold.
# Its layouts are synthesized on the block's own board (placement trials, then the production
# router with the outer pours below), ranked by open hot-loop links, then the in-block IR rails,
# then area; the best are a library for the top placement (one rigid macro each), and after
# placement the drawn layout's copper and pours become its `fixed_block` (pnr.hier.assemble
# --zones --group, pnr.hier.macro.fixed_block_from_macro).
#
# Two blocks, not one: U2's and U5's clusters as one rigid block (37 parts, 450-715 mm2 in the
# synthesis) fitted no legal place in 24 of 24 top starts (wave 4: the pmic regions are 20 mm
# wide, the strip west of J1 6.55 mm tall), so the subcell splits along its own hard-group
# clusters: the buck stage at U2, the eFuse stage at U5 (with D3 and its in/out caps).
#
# In situ (`site`): each block is synthesized on a board the size of its site, with the
# floorplan's regions on its parts moved into that frame, and fixed where it was made
# (integrate.py fixblocks). As free-floating macros the buck stage's 6 best layouts (15-19 mm)
# left 24 of 24 top starts without a slot: their U2/inductor bodies (pmic_switching, y <= 21.7)
# pinned the macro so low that it met MH2's keepout in every one (window analysis, wave 4).
# Sites [D]: the buck stage takes x 40-58 from MH2's keepout (y 3.5 + 3.25) up to
# pmic_switching's top (y 21.7); pmic_block keeps y 21.7-26.65, x 38-53 below and x 38-40 for
# the PMIC's other parts, and connector_esd/can_block their x <= 38.5 (with the site from x 38,
# 0 of 24 top starts were legal: D2 found no slot in 8, the CAN and flash passives in 15). The eFuse stage takes the strip west of J1 under J2's region (efuse_block,
# y up to J2's 6.95).
power_stage:
  blocks:
    - anchor: pmic
      contains: [pmic, pmic_inductors, pmic_in_caps, pmic_snubbers, r_sh, pmic_tp]
      fixed_block: { name: pwr_stage, group: PWR_STAGE, solid_layers: [F.Cu] }
      # The hot-rod lands (0.25 x 1.82 mm at 0.5 mm pitch) take no track at their class
      # clearance: one F.Cu pour per rail joins them, whole lands, solid connection
      # (pnr-inputs.md plane_partition `region`). 1V0_BUCK (L_b2 -> R_SH1, 0.5 mOhm) pours too.
      pours:
        - layer: F.Cu
          nets: [5V_SYS, PMIC_SW_B0, PMIC_SW_B1, PMIC_SW_B2, PMIC_SW_B3, 1V0_BUCK, GND]
          region: { parts: [pmic, pmic_inductors, pmic_in_caps, r_sh], margin_mm: 0.5 }
          terminals: pad
          connect: solid
          stitch_vias: 4
          split_gap_mm: 0.2
          min_width_mm: 0.25
          # a 0.05 mm raster: at the default 0.1 the 0.2-0.25 mm gaps between U2's lands left 8
          # of 15 5V_SYS lands unreached in the first block trial, all reached at 0.05
          h_mm: 0.05
          # The plane nets as pieces (yapnr PR #56), each stitched to its plane on its own: each
          # U2 row is 5V_SYS, SW, PGND, SW, 5V_SYS and its switch nodes leave on both sides, so
          # a 5V_SYS tree on F.Cu walled in the SW and PGND lands in 28-30 of 30 block layouts.
          pieces: [GND, 5V_SYS]
      # Datasheet hot loops (LP87524 SNVSAW2B 8.2.1.2-8.2.1.4): each part of `parts` must reach
      # `ic`'s pads on every listed net by copper inside the block, and each of `ic`'s lands on
      # such a net must reach one of the parts; an unreached one is an open hot-loop link (the
      # first ranking key).
      hot_loops:
        - { ic: pmic, parts: [pmic_in_caps], nets: [5V_SYS, GND] }
        - { ic: pmic, parts: [pmic_inductors], nets: ['PMIC_SW_B*'] }
        - { ic: pmic, parts: [pmic_snub_r], nets: ['PMIC_SW_B*'] }
      site: [40.0, 6.75, 58.0, 21.7]
    - anchor: efuse
      contains: [efuse, connector_tvs, efuse_caps]
      fixed_block: { name: efuse_stage, group: EFUSE_STAGE, solid_layers: [F.Cu] }
      # U5's VIN and OUT lands (0.3 x 2.4 mm, 0.2 mm apart): the same pour treatment. GND is
      # not poured here: U5's GND pin 8 is an ordinary 0.25 x 0.6 mm land between ILM and PG,
      # whose pour piece had no room for a stitch via in any of 30 block layouts (6 of 13 hot
      # links open); it escapes and drops to In1 like any GND pad.
      pours:
        - layer: F.Cu
          nets: [VIN_5V, 5V_SYS]
          region: { parts: [efuse, connector_tvs, efuse_caps], margin_mm: 0.5 }
          terminals: pad
          connect: solid
          stitch_vias: 2
          split_gap_mm: 0.2
          min_width_mm: 0.25
          h_mm: 0.05
          pieces: [5V_SYS]
      hot_loops: # TPS25947 layout: CIN and the TVS at IN/GND, COUT at OUT/GND
        - { ic: efuse, parts: [efuse_caps], nets: [VIN_5V, 5V_SYS, GND] }
        - { ic: efuse, parts: [connector_tvs], nets: [VIN_5V, GND] }
      site: [6.8, 0.4, 22.5, 6.95]
