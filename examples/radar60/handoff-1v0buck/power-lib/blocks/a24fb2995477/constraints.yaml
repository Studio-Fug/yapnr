    connect: solid
    stitch_vias: 4
    split_gap_mm: 0.2
    min_width_mm: 0.25
    h_mm: 0.05
    pieces:
      - GND
      - 5V_SYS
    region:
      refs:
        - '@pmic.c_in[[]0]'
        - '@pmic.c_in[[]1]'
        - '@pmic.c_in[[]2]'
        - '@pmic.c_in[[]3]'
