    plane_layer: In3.Cu
  rail_5v_sys:
    nets:
      - 5V_SYS
    plane_layer: In3.Cu
  rail_1v0_sh:
    nets:
      - 1V0_SH
    plane_layer: In3.Cu
ir_drop:
  - net: 1V0_BUCK
    sources:
      '@pmic.l_b2':
        - '2'
    sinks:
      '@pmic.r_sh':
        - '1'
    current_a: 2.5
    budget_mohm: 0.5
    temperature_c: 60
    two_point: false
pour:
  - layer: B.Cu
    net: GND
    connect: solid
region:
  - name: pmic_block
    hard: true
    reason: PMIC block, power-first
    refs:
      - '@pmic.u2'
      - '@pmic.l_*'
      - '@pmic.c_in*'
      - '@pmic.c_vana'
      - '@pmic.r_snb*'
      - '@pmic.c_snb*'
      - '@pmic.r_sh'
      - '@pmic.tp_isns'
      - '@pmic.r_s*'
    rect:
      - 0.0
      - 0.0
      - 18.3
      - 15.55
  - name: pmic_switching
    hard: true
    reason: switch nodes >= 8 mm from Y1 and >= 5 mm from RF
    refs:
      - '@pmic.u2'
      - '@pmic.l_b*'
    rect:
      - 1.3
      - 0.0
      - 18.3
      - 15.25
  - name: r4_digital
    hard: true
    reason: 'R4: no digital copper within 5 mm of the RF region (derived by integrate.py)'
    refs:
      - '@pmic.c_snb0'
      - '@pmic.c_snb1'
      - '@pmic.c_snb2'
      - '@pmic.c_snb3'
      - '@pmic.l_b0'
      - '@pmic.l_b1'
      - '@pmic.l_b2'
      - '@pmic.l_b3'
      - '@pmic.r_snb0'
      - '@pmic.r_snb1'
      - '@pmic.r_snb2'
      - '@pmic.r_snb3'
      - '@pmic.u2'
    areas:
      - rect:
          - 0.0
          - 0.0
          - 16.769
          - 15.25
      - rect:
          - 16.769
          - 0.0
          - 18.6
          - 15.55
plane_partition:
  - layer: F.Cu
    nets:
      - 5V_SYS
      - PMIC_SW_B0
      - PMIC_SW_B1
      - PMIC_SW_B2
      - PMIC_SW_B3
      - 1V0_BUCK
      - GND
