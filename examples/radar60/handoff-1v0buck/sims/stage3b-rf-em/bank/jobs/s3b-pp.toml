# stage 3b EM bank and ground (s3b-pp); written by em/bank/make_jobs.py
name = "s3b-pp"
image = "openems:0.37.0-rc3-x86-64-v4"
threads = 8
models_per_vm = 1
packing = "vcpu"
families = ["c4"]
openems_options = ["exact-endcriteria"]
memory_gb = 8
disk_gb = 16
max_wall_s = 5400

[inputs]
w = "<notes>/radar60/stage3b-rf/em/bank/code/examples/radar60/rf"
models = "<notes>/radar60/stage3b-rf/em/bank/models"

[env]
RFMACRO_ROOT = "w"

[[jobs]]
id = "pp-A-r27"
script = "w/openems/pp_sim.py"
args = ["models/pp-A.json", "--out", "{out}", "--threads", "{threads}", "--res", "0.027", "--t-ns", "4"]

[[jobs]]
id = "pp-A-r20"
script = "w/openems/pp_sim.py"
args = ["models/pp-A.json", "--out", "{out}", "--threads", "{threads}", "--res", "0.02", "--t-ns", "4"]

