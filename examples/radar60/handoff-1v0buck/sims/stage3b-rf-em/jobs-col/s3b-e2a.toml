id = "cell-c1b-1-r20"
script = "w/openems/ant_sim.py"
args = ["models/cell-c1b-1.json", "--out", "{out}", "--excite", "T1.Pg", "--threads", "{threads}", "--res", "0.0125", "--max-steps", "400000", "--mesh-ref", "models/cell-c1b-0.json,models/cell-c1b-2.json,models/cell-c1b-3.json,models/cell-c1b-4.json,models/cell-c1b-5.json,models/cell-c1b-6.json,models/cell-c1b-7.json,models/cell-c1b-8.json", "--fspan", "54", "70"]

