# stage 3b E1 (s3b-e1-bank-s1): written by openems/stage3b_em.py jobs; estimates [D] from the
# rf-uniform references scaled by cells and smallest cell: 8.58 VM-h, about $0.68 expected (boot and preemption extra)
name = "s3b-e1-bank-s1"
image = "openems:0.37.0-rc3-x86-64-v4"
threads = 8
models_per_vm = 1
packing = "vcpu"
families = ["c4d"]
openems_options = ["exact-endcriteria"]
memory_gb = 8
disk_gb = 16
max_wall_s = 14400

[inputs]
w = "${REPO}/examples/radar60/rf"
models = "<notes>/radar60/stage3b-rf/em/models"

[env]
RFMACRO_ROOT = "w"

[[jobs]]
id = "bank-S1-eTX1"
script = "w/openems/ant_sim.py"
args = ["models/bank-S1.json", "--out", "{out}", "--excite", "TX1.Pg", "--threads", "{threads}", "--max-steps", "400000"]
# estimate 87 min on c4d

[[jobs]]
id = "bank-S1-eTX2"
script = "w/openems/ant_sim.py"
args = ["models/bank-S1.json", "--out", "{out}", "--excite", "TX2.Pg", "--threads", "{threads}", "--max-steps", "400000"]
# estimate 87 min on c4d

[[jobs]]
id = "bank-S1-eTX3"
script = "w/openems/ant_sim.py"
args = ["models/bank-S1.json", "--out", "{out}", "--excite", "TX3.Pg", "--threads", "{threads}", "--max-steps", "400000"]
# estimate 87 min on c4d

[[jobs]]
id = "bank-S1-eRX3"
script = "w/openems/ant_sim.py"
args = ["models/bank-S1.json", "--out", "{out}", "--excite", "RX3.Pg", "--threads", "{threads}", "--max-steps", "400000"]
# estimate 127 min on c4d

[[jobs]]
id = "bank-S1-eRX4"
script = "w/openems/ant_sim.py"
args = ["models/bank-S1.json", "--out", "{out}", "--excite", "RX4.Pg", "--threads", "{threads}", "--max-steps", "400000"]
# estimate 127 min on c4d
