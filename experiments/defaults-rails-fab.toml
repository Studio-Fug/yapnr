# Gate for two default flips on this commit (owner decisions 2026-10-06):
#   (1) pnr.rail_alloc: search is now the default (no [configs] override needed; both arms
#       below get it, since this is no longer an A/B of rail_alloc itself).
#   (2) the ladder runner's --fab-profile default: jlc-pofv vs legacy, same commit, same
#       cells 20261006-ladder-b0ec34 found 21 of failing under jlc-pofv (09-mcu-usb-31's three
#       stackup variants, the six -rails/-pairs/-block/-classes/-partial/plain ufbga201
#       variants, and both buck-vqfnhr variants), plus every other public/hard-rung cell as a
#       no-regression check. The three brand-new "manual" rungs with an open target
#       (11-shove-channel-14, 11-shove-channel-lm-14, 12-soc-bga-113) are excluded: they are
#       known-incomplete ahead of the push-and-shove router / route-then-compact work, their
#       open nets are unrelated to the fab profile or rail allocation, and 12-soc-bga-113 alone
#       is a 240-minute cell -- out of scope for this gate.
schema = "yapnr-campaign-v1"
kind = "ladder-cell"
name = "defaults-rails-fab"
source = "HEAD"
image = "edge"
determinism = "wall_clock_budgeted"

[matrix]
case = [
  "01-connector-led-2", "02-resistor-led-3", "03-branched-leds-5", "04-inverter-leds-8",
  "05-timer-led-10", "06-chaser-14", "07-chaser-20", "07-chaser-20-4L-SGGS",
  "07-chaser-20-4L-SGPS", "07-chaser-20-4L-SGPS-arcblock", "07-chaser-20-4L-SGPS-double",
  "07-chaser-20-4L-SSGS", "07-chaser-20-6L-SGSGPS", "07-chaser-20-6L-SGSGPS-BB",
  "07-chaser-20-6L-SGSGPS-HDI", "07-chaser-20-6L-SGSSPS", "07-chaser-20-8L-SGSGPSGS",
  "07-chaser-20-abs", "07-chaser-20-double", "07-chaser-20-rel", "07-chaser-20-sidelock",
  "08-chaser-20-plane", "09-mcu-usb-31", "09-mcu-usb-31-4L-SGPS", "09-mcu-usb-31-4L-SSGS",
  "09-mcu-usb-31-6L-SGSGPS", "09-mcu-usb-31-abs", "09-mcu-usb-31-header", "09-mcu-usb-31-mc",
  "09-mcu-usb-31-rel", "09-mcu-usb-31-sidelock", "10-quad-bank-56", "11-buck-vqfnhr-4L-SGPS",
  "11-buck-vqfnhr-4L-SGPS-pour", "11-power-switch-31", "11-ufbga201-fanout-6L-SGSGPS",
  "11-ufbga201-fanout-6L-SGSGPS-block", "11-ufbga201-fanout-6L-SGSGPS-classes",
  "11-ufbga201-fanout-6L-SGSGPS-pairs", "11-ufbga201-fanout-6L-SGSGPS-partial",
  "11-ufbga201-fanout-6L-SGSGPS-rails", "edge-io-12", "edge-io-12-free", "hier-twin-bank-32",
  "line-chaser-20",
]
seed = [0, 1]
config = ["jlc-pofv", "legacy"]

[config]
rounds = 4
timeout = 1200
initial_pool = true
initial_starts = 8
initial_finalists = 3
showcases = true
hard = true
gloss = true
compact = true
route_pairs_diff_pairs = true

[configs.jlc-pofv]
fab_profile = "jlc-pofv"

[configs.legacy]
fab_profile = "legacy"

[resources]
cpus = 1
memory_gb = 3
disk_gb = 2
max_wall_s = 2400

# Both ranked families/regions (~/.config/yapnr/cloud.toml): us-west4's PREEMPTIBLE_CPUS quota
# (64) was fully in use by other concurrent campaigns at submit time (2026-10-06), so this falls
# back to c4/northamerica-northeast1, which had none in use.
[placement]
families = ["c4d", "c4"]
spot = true

[live]
enabled = true
interval_s = 45
mode = "thin"
