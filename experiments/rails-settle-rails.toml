# The -rails rung (11-ufbga201-fanout-6L-SGSGPS-rails) on seeds 0 to 7 under both fab
# profiles, in the ladder gate's configuration (rails-settle.toml): the rung that held the
# jlc-pofv default flip (rails-In4: VBAT's fill round J7.1 fell into three pieces), on the
# plane-partition fix for plated through-hole terminals.
schema = "yapnr-campaign-v1"
kind = "ladder-cell"
name = "rails-settle-rails"
source = "HEAD"
image = "edge"
determinism = "wall_clock_budgeted"

[matrix]
case = ["11-ufbga201-fanout-6L-SGSGPS-rails"]
seed = [0, 1, 2, 3, 4, 5, 6, 7]
config = ["jlc-pofv", "legacy"]

[config]
rounds = 4
timeout = 1200
initial_pool = true
initial_starts = 8
initial_finalists = 3
showcases = true
hard = true
gloss = true
compact = true
route_pairs_diff_pairs = true

[configs.jlc-pofv]
fab_profile = "jlc-pofv"

[configs.legacy]
fab_profile = "legacy"

[resources]
cpus = 1
memory_gb = 3
disk_gb = 2
max_wall_s = 2400

# Both ranked families, so a submit can spill to the fallback region when the first one's
# Spot quota is in use by other campaigns.
[placement]
families = ["c4d", "c4"]
spot = true

[live]
enabled = true
interval_s = 45
mode = "thin"
