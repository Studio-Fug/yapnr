# Order 0 D2: every formulation in parallel, and the references'
# forward predictions on the other substrates. One family (c4d-highcpu-16)
# for the comparison. Written by python -m yapnr.rf.order0 write.
name = "order0-d2"
image = "edge"

[defaults]
threads = 16
cpus = 8
memory_gb = 24
disk_gb = 10
max_wall_s = 10800
require_native = true

[placement]
shape = "c4d-highcpu-16"

[[jobs]]
id = "d2-base"
case = "divider"
spec = "specs/d2-base.json"
criteria = "criteria/d2.json"
threads = 8
cpus = 4
memory_gb = 8
disk_gb = 4
max_wall_s = 7200

[[jobs]]
id = "d2-robust"
case = "divider"
spec = "specs/d2-robust.json"
criteria = "criteria/d2.json"
threads = 8
cpus = 4
memory_gb = 8
disk_gb = 4
max_wall_s = 7200

