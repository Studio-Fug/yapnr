# Order 0 predictions: the ring A11 and the stub A12 in our FDTD (M-eq, M-eq-em528) and the
# 0.40 / 0.70 mm loss lines on M-nom and M-eq-em528. One family (c4-highcpu-16),
# as the region's demo. Written by python -m yapnr.rf.order0 predict.
name = "order0-predict-m"
image = "ghcr.io/studio-fug/yapnr@sha256:f41a4760a3d07f5adf04f5ee2e7ef96ff6eab687c7942cbe02450e0ca2564fd9"

[defaults]
threads = 16
cpus = 8
memory_gb = 24
disk_gb = 10
max_wall_s = 10800
require_native = true

[placement]
shape = "c4-highcpu-16"

[[jobs]]
id = "a11-ring-m-eq"
case = "divider"
validate = "runs/a11-ring-m-eq"
criteria = "criteria/ring.json"
args = ["--no-fine"]
max_wall_s = 7200

