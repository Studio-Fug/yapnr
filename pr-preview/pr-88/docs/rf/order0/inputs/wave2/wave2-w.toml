# Order 0 part 2, wave 2 (the one extra wave): D2 from the junction start.
# Written by part2/make_wave2.py; every variant changes wave 1's star spec as noted.
name = "order0-d2-wave2"
image = "edge"

[defaults]
threads = 8
cpus = 4
memory_gb = 8
disk_gb = 4
max_wall_s = 5400
require_native = true

[placement]
shape = "c4d-highcpu-16"

[[jobs]]
id = "d2-star-s21"
case = "divider"
spec = "specs/d2-star-s21.json"
criteria = "../criteria/d2.json"

[[jobs]]
id = "d2-star-guard"
case = "divider"
spec = "specs/d2-star-guard.json"
criteria = "../criteria/d2.json"

[[jobs]]
id = "d2-star-sched"
case = "divider"
spec = "specs/d2-star-sched.json"
criteria = "../criteria/d2.json"

[[jobs]]
id = "d2-star-s21-guard"
case = "divider"
spec = "specs/d2-star-s21-guard.json"
criteria = "../criteria/d2.json"
