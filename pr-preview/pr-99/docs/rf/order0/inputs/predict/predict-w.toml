# Order 0 predictions: the 3.0 mm loss lines on W-nom and W-eq-em528. One family (c4d-highcpu-16),
# as the region's demo. Written by python -m yapnr.rf.order0 predict.
name = "order0-predict-w"
image = "ghcr.io/studio-fug/yapnr@sha256:f41a4760a3d07f5adf04f5ee2e7ef96ff6eab687c7942cbe02450e0ca2564fd9"

[defaults]
threads = 16
cpus = 8
memory_gb = 24
disk_gb = 10
max_wall_s = 10800
require_native = true

[placement]
shape = "c4d-highcpu-16"

[[jobs]]
id = "line-w-w300-l20-w-nom"
case = "divider"
